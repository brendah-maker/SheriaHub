<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub - Kenya's Legal AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); }
        .hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 80px; font-family: 'Poppins', sans-serif; }
        .category-selector { display: flex; justify-content: center; gap: 10px; margin: -35px auto 25px; padding: 0 15px; flex-wrap: wrap; z-index: 10; position: relative; }
        .cat-btn { padding: 10px 20px; border-radius: 25px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cat-btn.active { background: var(--gold); color: black; }
        .chat-container { width: 95%; max-width: 650px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; margin-bottom: 15px; resize: none; box-sizing: border-box; outline: none; font-family: inherit; }
        .ask-btn { width: 100%; padding: 16px; background: var(--navy); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-family: 'Poppins', sans-serif; }
        .ask-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        .legal-card { padding: 25px; border-left: 6px solid var(--navy); background: #f8fafc; margin-top: 25px; border-radius: 12px; }
        .paywall { background: #fffbeb; border: 2px dashed var(--gold); padding: 30px; border-radius: 15px; margin-top: 25px; text-align: center; }
        .premium-content { background: #f0fff4; border: 2px solid #38a169; padding: 30px; border-radius: 15px; margin-top: 25px; white-space: pre-wrap; line-height: 1.8; }
        .footer { background: var(--navy); color: white; text-align: center; padding: 40px; margin-top: auto; border-top: 5px solid var(--gold); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.5rem;">⚖️ SheriaHub</div>
        <div style="font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 6px;">KENYA 🇰🇪</div>
    </nav>

    <header class="hero">
        <h1>Your Legal Rights, Simplified.</h1>
        <p>Expert legal intelligence for Citizens & Motorists.</p>
    </header>

    <div class="category-selector">
        <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy</button>
        <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Employment</button>
        <button class="cat-btn" id="btn-land" onclick="setCat('land')">🌳 Land</button>
        <button class="cat-btn" id="btn-family" onclick="setCat('family')">👨‍👩‍👧 Family</button>
        <button class="cat-btn" id="btn-traffic" onclick="setCat('traffic')">🚗 Traffic</button>
    </div>

    <main class="chat-container">
        <textarea id="q" placeholder="Ask about rent, deposits, or evictions..."></textarea>
        <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
        <div id="res"></div>
    </main>

    <footer class="footer">
        <p>© 2026 SheriaHub Kenya | Built for Justice</p>
    </footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let cat = "tenant";
    let lastQ = "";
    let poller = null;

    const savePaidId = (id) => localStorage.setItem('sheria_payment_id', id);
    const getPaidId = () => localStorage.getItem('sheria_payment_id');
    const clearPaidId = () => localStorage.removeItem('sheria_payment_id');

    function setCat(c) {
        cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
    }

    async function askAi(checkId = null) {
        const qInput = document.getElementById("q");
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        
        const activeId = checkId || getPaidId();
        const question = qInput.value || lastQ;
        if (!question) return;
        lastQ = question;

        btn.disabled = true;
        resDiv.innerHTML = `<p style="text-align:center;">⚖️ Sheria AI is analyzing Kenyan Law...</p>`;

        try {
            const response = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question, category: cat, checkout_id: activeId })
            });
            const data = await response.json();

            // SAFETY GATE: If AI fails, show error and HIDE paywall
            if (!data || !data.summary || data.summary === "undefined" || data.summary.length < 5) {
                resDiv.innerHTML = `
                    <div style="text-align:center; padding:20px; background:#fff5f5; border:1px solid #feb2b2; border-radius:12px; color:#c53030;">
                        ⚠️ <strong>Analysis failed:</strong> The AI couldn't generate a clear summary. 
                        <br><small>Please rephrase your question and try again.</small>
                    </div>`;
                return; 
            }

            if (data.status === "premium") {
                const formatted = data.content.replace(/\n/g, '<br>');
                resDiv.innerHTML = `
                    <div style="background:var(--gold); padding:5px 15px; border-radius:10px; font-weight:bold; display:inline-block; margin-bottom:10px;">
                        🎟️ ${data.credits_left} deep-dives remaining
                    </div>
                    <div class="premium-content"><h3>📋 Full Deep-Dive Result</h3>${formatted}</div>`;
                
                if (data.credits_left === 0) clearPaidId();
                else if (activeId) savePaidId(activeId);
                resDiv.scrollIntoView({ behavior: 'smooth' });
            } else {
                resDiv.innerHTML = `
                    <div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div>
                    <div class="paywall">
                        <h4>🔒 Unlock Detailed Legal Sections</h4>
                        <p>Get <strong>2 Full Legal Analysis</strong> credits for <strong>KSh 20</strong></p>
                        <input type="tel" id="phone" placeholder="07XXXXXXXX" style="padding:12px; width:80%; max-width:280px; margin-bottom:12px; border-radius:8px; border:1px solid #ccc;"><br>
                        <button class="ask-btn" style="background:var(--gold);color:black;max-width:280px;" id="payBtn" onclick="pay()">Pay via M-Pesa</button>
                        <div id="pStat" style="margin-top:12px; font-weight:600;"></div>
                    </div>`;
            }
        } catch (e) {
            resDiv.innerHTML = "<p style='color:red;text-align:center;'>The server is busy. Please click the button again.</p>";
        } finally { btn.disabled = false; }
    }

    async function pay() {
        const pInput = document.getElementById("phone").value;
        const pStat = document.getElementById("pStat");
        const payBtn = document.getElementById("payBtn");

        if(!pInput) return alert("Enter M-Pesa number");
        if (poller) clearInterval(poller);

        pStat.innerText = "⏳ Initializing STK Push...";
        payBtn.disabled = true;

        try {
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ phone: pInput })
            });
            const data = await res.json();
            if (!data.checkout_id) {
                pStat.innerText = "❌ Request Failed.";
                payBtn.disabled = false;
                return;
            }

            pStat.innerText = "📩 Prompt sent! Enter PIN on your phone...";

            poller = setInterval(async () => {
                try {
                    const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
                    const r = await check.json();
                    if (r.status === "paid") {
                        clearInterval(poller);
                        pStat.innerText = "✅ Paid!";
                        savePaidId(data.checkout_id);
                        askAi(data.checkout_id);
                    }
                } catch (e) {}
            }, 4000);
        } catch (e) { pStat.innerText = "❌ Network error."; payBtn.disabled = false; }
    }
</script>
</body>
</html>
