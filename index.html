<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Fast AI Law</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f4f7f6; --red: #ff4757; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; }
        .nav { background: var(--navy); color: white; padding: 12px 5%; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gold); }
        .hero { background: var(--navy); color: white; text-align: center; padding: 30px 20px; }
        .tabs { display: flex; justify-content: center; gap: 5px; margin: -20px 0 20px; flex-wrap: wrap; }
        .tab { padding: 8px 15px; border-radius: 20px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tab.active { background: var(--gold); color: white; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 70px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--navy); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result { margin-top: 15px; font-size: 14px; line-height: 1.4; }
        .kanjo-bubble { position: fixed; bottom: 20px; right: 20px; background: var(--red); width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 25px; cursor: pointer; z-index: 100; border: 2px solid white; }
        .kanjo-window { position: fixed; bottom: 85px; right: 20px; width: 280px; height: 400px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); display: none; flex-direction: column; z-index: 101; border: 1px solid #ddd; }
        .kanjo-header { background: var(--red); color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; font-size: 14px; }
        .kanjo-body { padding: 15px; flex: 1; overflow-y: auto; font-size: 13px; }
        .quiz-opt { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #eee; border-radius: 8px; background: white; cursor: pointer; text-align: left; font-size: 13px; }
        .quiz-opt:hover { background: #fff5f5; border-color: var(--red); }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--gold); border-radius: 50%; width: 15px; height: 15px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="nav">
        <div style="font-weight:bold;">⚖️ SheriaHub</div>
        <div id="creditsBadge" style="background:var(--gold); padding: 2px 8px; border-radius: 10px; font-size: 10px;">Credits: 0</div>
    </div>

    <div class="hero">
        <h3 style="margin:0;">Instant Law & Kanjo</h3>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setCat('tenant', this)">🏠 Rent</div>
        <div class="tab" onclick="setCat('traffic', this)">🚗 Road</div>
        <div class="tab" onclick="setCat('employment', this)">💼 Job</div>
        <div class="tab" onclick="setCat('family', this)">👨‍👩‍👧 Family</div>
    </div>

    <div class="container">
        <textarea id="q" placeholder="What happened?"></textarea>
        <button class="btn" onclick="askAi()">Ask Advisor</button>
        <div id="res" class="result"></div>
    </div>

    <div class="kanjo-bubble" onclick="toggleKanjo()">👮</div>
    <div id="kanjoWin" class="kanjo-window">
        <div class="kanjo-header"><span>🚨 Survival</span> <span onclick="toggleKanjo()" style="cursor:pointer">×</span></div>
        <div class="kanjo-body" id="kanjoBody">
            <p id="kanjoText">Kanjo is staring at your car...</p>
            <div id="kanjoCtrl"><button class="btn" style="background:var(--red)" onclick="gameCycle('START')">Play</button></div>
        </div>
    </div>

    <script>
        const API = "https://sheriahub.onrender.com"; 
        let currentCat = "tenant";

        function setCat(c, el) {
            currentCat = c;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleKanjo() {
            const w = document.getElementById("kanjoWin");
            w.style.display = (w.style.display === "flex") ? "none" : "flex";
        }

        async function askAi() {
            const q = document.getElementById("q").value;
            const resDiv = document.getElementById("res");
            if(!q) return;
            resDiv.innerHTML = "<div class='loader'></div> Summarizing...";
            const response = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ question: q, category: currentCat, checkout_id: localStorage.getItem("sheria_id") })
            });
            const data = await response.json();
            if(data.status === "premium") {
                resDiv.innerHTML = `<div style="background:#e6fffa; padding:10px; border-radius:8px;">${data.content.replace(/\n/g, '<br>')}</div>`;
                document.getElementById("creditsBadge").innerText = `Credits: ${data.credits_left}`;
            } else {
                resDiv.innerHTML = `<b>Summary:</b> ${data.summary}<br><div style="margin-top:10px; text-align:center;"><button class="btn" style="width:auto; padding:5px 15px; font-size:12px;" onclick="pay()">Unlock Acts (KSh 20)</button></div>`;
            }
        }

        async function pay() {
            const phone = prompt("Enter M-Pesa Number:");
            if(!phone) return;
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ phone })
            });
            const data = await res.json();
            if(data.checkout_id) { alert("Check phone!"); poll(data.checkout_id); }
        }

        function poll(id) {
            const timer = setInterval(async () => {
                const res = await fetch(`${API}/check-payment/${id}`);
                const data = await res.json();
                if(data.status === "paid") { clearInterval(timer); localStorage.setItem("sheria_id", id); askAi(); }
            }, 3000);
        }

        async function gameCycle(input) {
            const text = document.getElementById("kanjoText");
            const ctrl = document.getElementById("kanjoCtrl");
            text.innerHTML = "<div class='loader'></div>...";
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ question: input, category: "kanjo" })
            });
            const data = await res.json();
            text.innerHTML = data.summary.replace(/\n/g, "<br>");
            ctrl.innerHTML = `
                <button class="quiz-opt" onclick="gameCycle('A')">A</button>
                <button class="quiz-opt" onclick="gameCycle('B')">B</button>
                <button class="quiz-opt" onclick="gameCycle('C')">C</button>
                <button class="btn" style="background:#777; margin-top:10px; font-size:11px;" onclick="gameCycle('START')">Restart</button>
            `;
        }
    </script>
</body>
</html>
