<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheriaHub - Kenya's Legal AI</title>
<style>
:root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; }

/* Stick Footer to bottom */
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; }
.content { flex: 1 0 auto; }

/* NAVBAR */
.navbar { background: var(--navy); color: white; padding: 15px 5%; border-bottom: 3px solid var(--gold); }

/* HERO */
.hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 80px; }
.hero h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.5rem); }

/* CATEGORY SELECTOR */
.category-selector { display: flex; justify-content: center; gap: 10px; margin: -30px auto 20px; padding: 0 15px; }
.cat-btn { flex: 1; max-width: 180px; padding: 12px; border-radius: 25px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
.cat-btn.active { background: var(--gold); color: black; }

/* CHAT CONTAINER */
.chat-container { max-width: 90%; width: 700px; margin: 0 auto 40px; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

/* ADAPTABLE TEXTAREA */
textarea { 
    width: 100%; min-height: 50px; padding: 15px; border-radius: 10px; border: 2px solid #ddd; 
    box-sizing: border-box; font-size: 16px; font-family: inherit; resize: none; overflow: hidden; margin-bottom: 10px;
}
textarea:focus { outline: none; border-color: var(--gold); }

.ask-btn { 
    width: 100%; padding: 15px; background: var(--navy); color: white; border: none; 
    border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px;
}

/* LOADING SPINNER CSS */
.spinner {
  width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;
  display: none; /* Hidden by default */
}
@keyframes spin { to { transform: rotate(360deg); } }

.paywall { background: #fffdf2; border: 2px dashed var(--gold); padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }

.footer { flex-shrink: 0; background: var(--navy); color: white; text-align: center; padding: 40px 20px; border-top: 5px solid var(--gold); font-size: 0.85rem; }
</style>
</head>
<body>

<div class="content">
  <div class="navbar"><strong>⚖️ SheriaHub</strong></div>
  <div class="hero">
    <h1>Your Legal Rights, Simplified.</h1>
    <p>Tenant & Employment Law Kenya</p>
  </div>

  <div class="category-selector">
    <button class="cat-btn active" id="t-btn" onclick="setCat('tenant')">🏠 Tenant</button>
    <button class="cat-btn" id="e-btn" onclick="setCat('employment')">💼 Job Law</button>
  </div>

  <div class="chat-container">
    <textarea id="question" placeholder="e.g. Can my landlord lock my door?" rows="1" oninput="autoResize(this)"></textarea>
    <button class="ask-btn" id="askBtn" onclick="askSheria()">
        <span id="btnText">Consult AI</span>
        <div class="spinner" id="btnSpinner"></div>
    </button>
    <div id="responseArea"></div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 SheriaHub Kenya | Powered by Gemini 2.5 Flash</p>
</footer>

<script>
const API = "https://sheriahub.vercel.app"; // Update this
let category = "tenant";
let price = 20;
let deepDiveContent = "";

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = textarea.scrollHeight + 'px';
}

function setCat(c) {
    category = c;
    price = (c === 'tenant') ? 20 : 50;
    document.getElementById('t-btn').classList.toggle('active', c === 'tenant');
    document.getElementById('e-btn').classList.toggle('active', c === 'employment');
}

async function askSheria() {
    const q = document.getElementById("question").value;
    const btn = document.getElementById("askBtn");
    const spinner = document.getElementById("btnSpinner");
    const out = document.getElementById("responseArea");

    if(!q) return;

    // Show loading state
    btn.disabled = true;
    spinner.style.display = "block";
    out.innerHTML = "";

    try {
        const res = await fetch(`${API}/ask-ai`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ question: q, category: category })
        });
        const data = await res.json();
        deepDiveContent = data.paid_deep_dive;

        out.innerHTML = `
            <div style="padding:15px; border-left:4px solid var(--navy); background:#f9fafb; margin-top:20px;">
                <strong>Summary:</strong><br>${data.free_summary}
            </div>
            <div class="paywall">
                <h4>🔒 Unlock Action Plan</h4>
                <p>KSh ${price} for full guidance.</p>
                <button class="ask-btn" id="payBtn" style="background:var(--gold); color:black;" onclick="startPayment()">
                    <span id="payText">Pay via M-Pesa</span>
                    <div class="spinner" id="paySpinner" style="border-top-color: #000; border-color: rgba(0,0,0,0.1);"></div>
                </button>
                <div id="p-status" style="margin-top:10px; font-weight:bold;"></div>
            </div>
        `;
    } catch(e) { out.innerHTML = "❌ Connection failed."; }
    finally {
        btn.disabled = false;
        spinner.style.display = "none";
    }
}

async function startPayment() {
    const phone = prompt("Enter M-Pesa Number (2547...)");
    if(!phone) return;

    const btn = document.getElementById("payBtn");
    const spinner = document.getElementById("paySpinner");
    const status = document.getElementById("p-status");

    btn.disabled = true;
    spinner.style.display = "block";
    status.innerText = "⏳ Sending STK Push...";

    try {
        const res = await fetch(`${API}/stkpush`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ phone: phone, amount: price })
        });
        const data = await res.json();
        
        if(!data.checkout_id) {
            status.innerText = "❌ Push failed.";
            btn.disabled = false;
            spinner.style.display = "none";
            return;
        }

        status.innerText = "⏳ Enter M-Pesa PIN on your phone...";

        const poll = setInterval(async () => {
            const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
            const result = await check.json();

            if(result.status === "paid") {
                clearInterval(poll);
                document.getElementById("responseArea").innerHTML = `
                    <div style="background:#e7f9ee; border-left:5px solid #27ae60; padding:20px; border-radius:10px;">
                        <h3>✅ Full Advice Unlocked</h3>
                        <p>${deepDiveContent.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
            } else if(result.status === "failed") {
                clearInterval(poll);
                status.innerText = "❌ Payment failed.";
                btn.disabled = false;
                spinner.style.display = "none";
            }
        }, 3000);
    } catch(e) { 
        status.innerText = "❌ Error.";
        btn.disabled = false;
        spinner.style.display = "none";
    }
}
</script>
</body>
</html>
