<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheriaHub - Tenant & Landlord Rights Kenya</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5f7fa;
}

/* NAV */
.navbar {
  background: #0a1f44;
  color: white;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
}

.hero {
  background: #0a1f44;
  color: white;
  text-align: center;
  padding: 80px 20px;
}

.chat-container {
  max-width: 650px;
  margin: -50px auto 40px;
  background: white;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.input-group {
  display: flex;
  gap: 10px;
}

input {
  flex-grow: 1;
  padding: 12px;
  border-radius: 8px;
  border: 2px solid #ddd;
}

button {
  padding: 12px 20px;
  background: #0a1f44;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled {
  background: #888;
  cursor: not-allowed;
}

#response {
  margin-top: 20px;
}

.paywall {
  background: #f0f7ff;
  padding: 20px;
  margin-top: 15px;
  border-left: 5px solid #0a1f44;
}
</style>
</head>

<body>

<div class="navbar">
  <div><strong>SheriaHub</strong></div>
</div>

<div class="hero">
  <h1>SheriaHub: Tenant & Landlord Rights</h1>
  <p>Simplified Kenyan legal information powered by AI</p>
</div>

<div class="chat-container">
  <h2>Ask a Question</h2>

  <div class="input-group">
    <input type="text" id="question" placeholder="e.g. eviction notice period">
    <button id="askBtn" onclick="getAnswer()">Ask</button>
  </div>

  <div id="response"></div>
</div>

<script>
const API_BASE = "https://sheriahub.onrender.com";

async function getAnswer() {
  const q = document.getElementById("question").value.trim();
  const responseDiv = document.getElementById("response");
  const btn = document.getElementById("askBtn");

  if (!q) {
    responseDiv.innerHTML = "<p style='color:red;'>Enter a question</p>";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Thinking...";

  responseDiv.innerHTML = "<p>🔍 Analyzing Kenyan law...</p>";

  try {
    const res = await fetch(`${API_BASE}/ask-ai`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ question: q })
    });

    if (!res.ok) throw new Error("Server error");

    const data = await res.json();

    if (!data.free_summary) throw new Error("Invalid AI response");

    responseDiv.innerHTML = `
      <p><strong>Answer:</strong> ${data.free_summary}</p>

      <div class="paywall">
        <p>🔒 Unlock full legal guidance (KSh 20)</p>
        <button onclick="unlockAnswer()">Pay with M-Pesa</button>
        <div id="mpesaStatus"></div>
      </div>
    `;

    // store deep answer globally (safe)
    window.paidAnswer = data.paid_deep_dive;

  } catch (err) {
    responseDiv.innerHTML = `<p style="color:red;">❌ ${err.message}</p>`;
  }

  btn.disabled = false;
  btn.innerText = "Ask";
}

async function unlockAnswer() {
  const phone = prompt("Enter phone (2547XXXXXXXX):");
  if (!phone) return;

  const statusDiv = document.getElementById("mpesaStatus");
  statusDiv.innerHTML = "⏳ Sending STK push...";

  try {
    const res = await fetch(`${API_BASE}/stkpush`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ phone })
    });

    const data = await res.json();

    if (data.ResponseCode === "0") {
      statusDiv.innerHTML = "✅ Payment request sent. Enter PIN...";

      setTimeout(() => {
        document.getElementById("response").innerHTML = `
          <div style="padding:20px;border:2px solid #0a1f44;border-radius:10px;">
            <h3>AI Legal Insight</h3>
            <p>${window.paidAnswer}</p>
            <button onclick="location.reload()">Ask another</button>
          </div>
        `;
      }, 5000);

    } else {
      statusDiv.innerHTML = "❌ Payment failed";
    }

  } catch (err) {
    statusDiv.innerHTML = "❌ Server error";
  }
}
</script>

</body>
</html>
