<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Legal AI & Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; --white: #ffffff; --text: #2d3748; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; line-height: 1.6; }
        h1, h2, h3, .navbar-brand { font-family: 'Poppins', sans-serif; }
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        .hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 80px; }
        .hero h1 { margin: 0; font-size: 2.2rem; }
        .category-selector { display: flex; justify-content: center; gap: 10px; margin: -40px auto 30px; padding: 0 15px; flex-wrap: wrap; z-index: 10; position: relative; max-width: 1000px; }
        .cat-btn { padding: 12px 20px; border-radius: 30px; border: 2px solid var(--gold); background: var(--white); cursor: pointer; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 0.9rem; }
        .cat-btn.active { background: var(--gold); color: black; transform: translateY(-2px); }
        .chat-container { width: 95%; max-width: 700px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 130px; padding: 18px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; margin-bottom: 15px; resize: none; outline: none; font-family: inherit; }
        .ask-btn { width: 100%; padding: 16px; background: var(--navy); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.1rem; transition: 0.3s; }
        .legal-card { padding: 25px; border-left: 6px solid var(--navy); background: #f8fafc; margin-top: 25px; border-radius: 12px; }
        .paywall { background: #fffbeb; border: 2px dashed var(--gold); padding: 35px; border-radius: 15px; margin-top: 25px; text-align: center; }
        .premium-content { background: #f0fff4; border: 2px solid #38a169; padding: 30px; border-radius: 15px; margin-top: 25px; line-height: 1.8; white-space: pre-wrap; }
        
        /* WIDGET & QUIZ STYLING */
        .widget-bubble { position: fixed; bottom: 30px; right: 30px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 2000; }
        .widget-window { position: fixed; bottom: 110px; right: 30px; width: 360px; height: 500px; background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 2001; border: 1px solid #e2e8f0; overflow: hidden; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .widget-header { background: var(--navy); color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: 700; }
        .widget-body { flex: 1; padding: 20px; overflow-y: auto; background: #fcfcfc; }
        .option-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; }
        .option-btn:hover { border-color: var(--gold); background: #fffcf0; }
        .level-badge { background: #e2e8f0; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; color: var(--navy); font-weight: 700; margin-bottom: 10px; display: inline-block; }
        .footer { background: var(--navy); color: white; text-align: center; padding: 40px; margin-top: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">⚖️ SheriaHub</div>
        <div style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px;">KENYA 🇰🇪</div>
    </nav>

    <div class="main-content">
        <header class="hero">
            <h1>Your Legal Rights, Simplified.</h1>
            <p>Consult the law or play the <strong>Legal Quiz Game</strong>.</p>
        </header>

        <div class="category-selector">
            <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy</button>
            <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Employment</button>
            <button class="cat-btn" id="btn-family" onclick="setCat('family')">👨‍👩‍👧 Family</button>
            <button class="cat-btn" id="btn-traffic" onclick="setCat('traffic')">🚗 Traffic</button>
            <button class="cat-btn" id="btn-civil_criminal" onclick="setCat('civil_criminal')">⚖️ Civil/Criminal</button>
        </div>

        <main class="chat-container">
            <textarea id="q" placeholder="Ask about rent, deposits, or evictions..."></textarea>
            <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
            <div id="res"></div>
        </main>
    </div>

    <!-- QUIZ WIDGET -->
    <div class="widget-bubble" onclick="toggleWidget()">🎮</div>
    <div id="gameWidget" class="widget-window">
        <div class="widget-header">
            <span>Sheria Quiz Game</span>
            <span style="cursor:pointer;" onclick="toggleWidget()">✕</span>
        </div>
        <div id="gameBody" class="widget-body">
            <div id="lvlDisplay" class="level-badge">Level: Beginner</div>
            <p id="gameText">Ready to test your legal knowledge? Click below to begin!</p>
            <div id="gameOptions">
                <button class="ask-btn" style="padding:12px; font-size:0.9rem;" onclick="gameAction('START')">Start Game 🚀</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 SheriaHub Kenya | Built for Justice</p>
    </footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let currentLevel = "Beginner";
    let score = 0;

    const savePaidId = (id) => localStorage.setItem('sheria_payment_id', id);
    const getPaidId = () => localStorage.getItem('sheria_payment_id');

    function toggleWidget() {
        const w = document.getElementById("gameWidget");
        w.style.display = (w.style.display === "flex") ? "none" : "flex";
    }

    function setCat(c) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
        const p = { tenant: "Ask about rent...", employment: "Ask about dismissal...", family: "Ask about custody...", traffic: "Ask about fines...", civil_criminal: "Ask about theft..." };
        document.getElementById("q").placeholder = p[c];
    }

    async function askAi(checkId = null) {
        const question = document.getElementById("q").value;
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        if (!question) return;

        btn.disabled = true;
        resDiv.innerHTML = `<p style="text-align:center;">⚖️ Analyzing...</p>`;

        try {
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question, category: "tenant", checkout_id: getPaidId() })
            });
            const data = await res.json();
            if (data.status === "premium") {
                resDiv.innerHTML = `<div class="premium-content"><h3>📋 Full Result</h3>${data.content.replace(/\n/g, '<br>')}</div>`;
            } else {
                resDiv.innerHTML = `<div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div><div class="paywall"><h4>🔒 Unlock Full Details</h4><p>KSh 20 for 2 Credits</p><button class="ask-btn" onclick="pay()">Pay via M-Pesa</button></div>`;
            }
        } catch (e) { resDiv.innerHTML = "Error. Try again."; }
        finally { btn.disabled = false; }
    }

    async function gameAction(msg) {
        const body = document.getElementById("gameText");
        const opts = document.getElementById("gameOptions");
        const lvl = document.getElementById("lvlDisplay");

        body.innerHTML = "⏳ Generating Challenge...";
        opts.innerHTML = "";

        try {
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question: msg, category: "game", level: currentLevel })
            });
            const data = await res.json();
            
            body.innerHTML = data.summary.replace(/\n/g, '<br>');
            
            if (msg === 'START' || msg.includes('answer')) {
                // If it's a question, show A, B, C buttons
                opts.innerHTML = `
                    <button class="option-btn" onclick="gameAction('My answer is A')">Option A</button>
                    <button class="option-btn" onclick="gameAction('My answer is B')">Option B</button>
                    <button class="option-btn" onclick="gameAction('My answer is C')">Option C</button>
                    <button class="ask-btn" style="margin-top:15px; background:#edf2f7; color:#4a5568;" onclick="gameAction('START')">Next Challenge ⏭️</button>
                `;
            } else {
                // If it's feedback, show 'Next' button
                opts.innerHTML = `<button class="ask-btn" onclick="gameAction('START')">Next Question 🚀</button>`;
                // Logic to increment level based on progress could be added here
            }
        } catch (e) { body.innerHTML = "Connection Error. Try again."; }
    }

    async function pay() {
        const phone = prompt("Enter M-Pesa Number (254...):");
        if(!phone) return;
        try {
            const res = await fetch(`${API}/stkpush`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ phone }) });
            const { checkout_id } = await res.json();
            const poller = setInterval(async () => {
                const check = await fetch(`${API}/check-payment/${checkout_id}`);
                const r = await check.json();
                if (r.status === "paid") { clearInterval(poller); savePaidId(checkout_id); askAi(); }
            }, 4000);
        } catch (e) { alert("Error"); }
    }
</script>
</body>
</html>
