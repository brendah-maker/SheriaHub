<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub - Kenya's Legal AI Consultation</title>
    <style>
        :root { 
            --navy: #0a1f44; 
            --gold: #f39c12; 
            --bg: #f4f7f6; 
            --white: #ffffff;
            --text-main: #333333;
            --gray-light: #e2e8f0;
        }
        
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { 
            display: flex; 
            flex-direction: column; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
        }

        /* Navbar & Hero */
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); }
        .hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 70px; }
        .hero h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -0.5px; }
        .hero p { opacity: 0.85; margin-top: 10px; font-size: 1.1rem; }

        /* Main Content Layout */
        .main-content { flex: 1 0 auto; padding-bottom: 40px; }
        
        /* Category Selector */
        .category-selector { display: flex; justify-content: center; gap: 15px; margin: -25px auto 30px; padding: 0 15px; }
        .cat-btn { 
            flex: 1; 
            max-width: 200px; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 2px solid var(--gold); 
            background: var(--white); 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .cat-btn.active { background: var(--gold); color: var(--navy); }
        .cat-btn:hover:not(.active) { background: #fffdf5; }

        /* Consultation Interface */
        .consultation-container { 
            max-width: 90%; 
            width: 750px; 
            margin: 0 auto; 
            background: var(--white); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            border: 1px solid var(--gray-light); 
        }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        textarea { 
            width: 100%; 
            min-height: 100px; 
            padding: 15px; 
            border-radius: 8px; 
            border: 2px solid var(--gray-light); 
            font-size: 1rem; 
            font-family: inherit; 
            resize: vertical; 
            transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--navy); }
        
        .ask-btn { 
            padding: 14px 24px; 
            background: var(--navy); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            transition: opacity 0.2s; 
            align-self: flex-end;
        }
        .ask-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Results & Paywall Styling */
        #response-area { margin-top: 30px; }
        
        .legal-summary {
            padding: 20px; 
            border-left: 5px solid var(--navy); 
            background: #f8fafc; 
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .legal-summary h3 { margin-top: 0; color: var(--navy); font-size: 1.2rem; }

        .paywall-card { 
            background: #fffcf0; 
            border: 2px dashed var(--gold); 
            padding: 25px; 
            border-radius: 8px; 
            text-align: center; 
        }
        .paywall-card h4 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--navy); }
        
        .phone-input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }

        .premium-content {
            background: #f0fdf4; 
            border-left: 5px solid #16a34a; 
            padding: 20px; 
            border-radius: 0 8px 8px 0; 
            margin-top:20px;
            line-height: 1.6;
        }

        /* Footer */
        .footer { flex-shrink: 0; background: var(--navy); color: white; text-align: center; padding: 25px 20px; border-top: 4px solid var(--gold); font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="main-content">
    <nav class="navbar">
        <div style="font-weight: 700; font-size: 1.3rem;">⚖️ SheriaHub</div>
        <div style="font-size: 0.85rem; font-weight: 500;">Kenya 🇰🇪</div>
    </nav>

    <header class="hero">
        <h1>Legal clarity, in seconds.</h1>
        <p>Expert-level insights for Tenants, Landlords, and Employees.</p>
    </header>

    <div class="category-selector">
        <button class="cat-btn active" id="tenant-tab" onclick="switchCategory('tenant')">🏠 Tenant/Landlord</button>
        <button class="cat-btn" id="job-tab" onclick="switchCategory('employment')">💼 Employment</button>
    </div>

    <main class="consultation-container">
        <div class="input-group">
            <textarea id="question" placeholder="Describe your legal issue here... (e.g., 'My landlord locked my door because I am two days late on rent. What are my rights?')"></textarea>
            <button class="ask-btn" id="askBtn" onclick="getLegalAdvice()">Analyze Case</button>
        </div>
        <div id="response-area"></div>
    </main>
</div>

<footer class="footer">
    <p><strong>Disclaimer:</strong> SheriaHub provides AI-generated legal information, not formal legal representation.</p>
    <p>© 2026 SheriaHub Kenya</p>
</footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let currentCategory = "tenant";
    let storedPaidContent = "";

    function switchCategory(cat) {
        currentCategory = cat;
        document.getElementById('tenant-tab').classList.toggle('active', cat === 'tenant');
        document.getElementById('job-tab').classList.toggle('active', cat === 'employment');
    }

    async function getLegalAdvice() {
        const q = document.getElementById("question").value.trim();
        const resDiv = document.getElementById("response-area");
        const btn = document.getElementById("askBtn");
        
        if (!q) {
            alert("Please describe your legal issue first.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Analyzing...";
        resDiv.innerHTML = "<p style='text-align:center; color: #666;'>⏳ Reviewing Kenyan statutes and tribunals...</p>";

        try {
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question: q, category: currentCategory })
            });

            if (!res.ok) throw new Error("Server responded with an error.");
            
            const data = await res.json();
            
            if (data.error) throw new Error(data.error);

            storedPaidContent = data.paid_deep_dive;
            
            resDiv.innerHTML = `
                <div class="legal-summary">
                    <h3>Preliminary Assessment</h3>
                    <p>${data.free_summary.replace(/\n/g, '<br>')}</p>
                </div>
                <div class="paywall-card">
                    <h4>🔒 Unlock Professional Action Plan</h4>
                    <p>Get specific law citations, next steps, and tribunal procedures for <strong>KSh 20</strong>.</p>
                    <input type="tel" id="mpesaPhone" class="phone-input" placeholder="07XX XXX XXX" maxlength="13">
                    <br>
                    <button class="ask-btn" id="payBtn" style="background:var(--gold); color:var(--navy); width:100%; max-width: 300px;" onclick="handlePayment()">Pay via M-Pesa</button>
                    <div id="pStatus" style="margin-top:15px; font-weight:600; color:var(--navy);"></div>
                </div>`;
        } catch (e) {
            console.error(e);
            resDiv.innerHTML = `<p style='color:#dc2626; text-align:center; padding: 20px;'>❌ Unable to process request: ${e.message}</p>`;
        } finally {
            btn.disabled = false;
            btn.innerText = "Analyze Case";
        }
    }

    async function handlePayment() {
        const phoneInput = document.getElementById("mpesaPhone").value.trim();
        const statusDiv = document.getElementById("pStatus");
        const payBtn = document.getElementById("payBtn");

        if (!phoneInput || phoneInput.length < 9) {
            statusDiv.innerHTML = "⚠️ Please enter a valid Safaricom number.";
            statusDiv.style.color = "#dc2626";
            return;
        }

        payBtn.disabled = true;
        statusDiv.style.color = "var(--navy)";
        statusDiv.innerHTML = "⏳ Sending M-Pesa Request...";

        try {
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ phone: phoneInput })
            });

            const data = await res.json();
            
            if (data.error) throw new Error(data.error);

            statusDiv.innerHTML = "📲 STK Push sent. Please enter your M-Pesa PIN...";

            let attempts = 0;
            const maxAttempts = 15; // 60 seconds total

            const interval = setInterval(async () => {
                attempts++;
                try {
                    const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
                    const result = await check.json();

                    if (result.status === "paid") {
                        clearInterval(interval);
                        document.querySelector('.paywall-card').style.display = 'none';
                        document.getElementById("response-area").innerHTML += `
                            <div class="premium-content" id="premium-view">
                                <h3 style="margin-top:0; color: #166534;">✅ Action Plan & Citations</h3>
                                <p>${storedPaidContent.replace(/\n/g, '<br>')}</p>
                            </div>`;
                        // Scroll to the new content
                        document.getElementById('premium-view').scrollIntoView({ behavior: 'smooth' });
                    } 
                    else if (result.status === "failed" && attempts > 4) {
                        // Give the user a grace period before declaring failure
                        clearInterval(interval);
                        statusDiv.innerHTML = "❌ Payment failed or was cancelled.";
                        statusDiv.style.color = "#dc2626";
                        payBtn.disabled = false;
                        payBtn.innerText = "Try Again";
                    }
                    else if (attempts >= maxAttempts) { 
                        clearInterval(interval);
                        statusDiv.innerHTML = "⚠️ Request timed out. If you paid, please refresh.";
                        statusDiv.style.color = "#b45309";
                        payBtn.disabled = false;
                        payBtn.innerText = "Verify Payment";
                    }
                } catch (checkErr) {
                    console.error("Polling error:", checkErr);
                }
            }, 4000);
            
        } catch (err) {
            statusDiv.innerHTML = `❌ Error: ${err.message || "Failed to initiate payment."}`;
            statusDiv.style.color = "#dc2626";
            payBtn.disabled = false;
        }
    }
</script>
</body>
</html>
