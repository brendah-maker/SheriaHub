<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Logic Foundry Agreement Audit</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .emerald-text { color: #10b981; }
        .emerald-bg { background-color: #10b981; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .cat-btn { padding: 12px 20px; border-radius: 12px; border: 1px solid #1e293b; background: #1e293b; color: #94a3b8; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .cat-btn.active { background: #10b981; color: #0f172a; border-color: #10b981; }
        .legal-card { padding: 25px; border-left: 6px solid #10b981; background: rgba(255,255,255,0.03); margin-top: 25px; border-radius: 12px; }
        .red-flag { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav class="p-6 glass sticky top-0 z-50 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 emerald-bg rounded shadow-lg shadow-emerald-500/20"></div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">Sheria<span class="emerald-text">Hub</span></h1>
        </div>
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">A Logic Foundry Product</div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <header class="text-center mb-12">
            <h2 class="text-4xl md:text-6xl font-black text-white leading-tight">Mkataba<span class="emerald-text">Check</span></h2>
            <p class="text-slate-400 mt-4">Audit any Kenyan agreement for illegal clauses and hidden risks in seconds.</p>
        </header>

        <div class="flex flex-wrap gap-3 justify-center mb-10">
            <button class="cat-btn active" id="btn-contract_audit" onclick="setCat('contract_audit')">📄 MkatabaCheck</button>
            <button class="cat-btn" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy Q&A</button>
            <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Workplace Q&A</button>
            <button class="cat-btn" id="btn-family" onclick="setCat('family')">⚖️ General Law</button>
        </div>

        <div class="glass p-8 rounded-[2.5rem]">
            <!-- File Upload (Only shows when MkatabaCheck is active) -->
            <div id="file-area" class="mb-6">
                <label class="block text-[10px] font-black emerald-text uppercase tracking-widest mb-3">Upload Contract (PDF)</label>
                <input type="file" id="contract_file" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-emerald-500/10 file:text-emerald-500">
            </div>

            <!-- Text Question (Shows for other categories) -->
            <div id="text-area" class="hidden">
                <textarea id="q" placeholder="What is your legal question?" class="w-full h-32 bg-slate-900 border-none rounded-2xl p-4 text-white outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <button id="askBtn" onclick="askAi()" class="w-full py-5 emerald-bg text-slate-950 font-black rounded-2xl uppercase tracking-widest hover:scale-[0.99] transition-all">Start AI Audit</button>
            
            <div id="res"></div>
        </div>
    </main>

<script>
    let cat = "contract_audit";
    const API = ""; // YOUR RENDER LINK

    function setCat(c) {
        cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
        
        if (c === 'contract_audit') {
            document.getElementById('file-area').classList.remove('hidden');
            document.getElementById('text-area').classList.add('hidden');
            document.getElementById('askBtn').innerText = "Start AI Audit";
        } else {
            document.getElementById('file-area').classList.add('hidden');
            document.getElementById('text-area').classList.remove('hidden');
            document.getElementById('askBtn').innerText = "Get Legal Consultation";
        }
    }

    async function askAi(checkId = null) {
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        const fileInput = document.getElementById("contract_file");
        const qInput = document.getElementById("q");
        
        const activeId = checkId || localStorage.getItem('sheria_id');
        
        const formData = new FormData();
        formData.append("category", cat);
        formData.append("checkout_id", activeId);
        
        if (cat === "contract_audit") {
            if (!fileInput.files[0]) return alert("Please upload a PDF contract");
            formData.append("contract_file", fileInput.files[0]);
        } else {
            if (!qInput.value) return alert("Please enter a question");
            formData.append("question", qInput.value);
        }

        btn.disabled = true;
        resDiv.innerHTML = `<p class="text-center animate-pulse mt-8 emerald-text uppercase font-bold text-xs">⏳ Logic Foundry AI is auditing statutes...</p>`;

        try {
            const response = await fetch(`${API}/ask-ai`, { method: "POST", body: formData });
            const data = await response.json();

            let html = `<div class="legal-card"><b class="emerald-text uppercase text-[10px]">AI Summary</b><p class="text-white mt-2">${data.summary}</p></div>`;

            if (data.red_flags) {
                html += `<div class="mt-4"><b class="text-red-400 uppercase text-[10px]">Red Flags Detected</b>`;
                data.red_flags.forEach(f => { html += `<div class="red-flag">⚠️ ${f}</div>`; });
                html += `</div>`;
            }

            if (data.status === "premium") {
                html += `<div class="bg-emerald-500/10 p-6 rounded-2xl mt-4 border border-emerald-500/20">
                            <b class="emerald-text uppercase text-[10px]">Deep-Dive Legal Counsel</b>
                            <p class="text-slate-300 text-sm mt-3 whitespace-pre-wrap">${data.content}</p>
                         </div>`;
            } else {
                html += `
                <div class="p-8 bg-slate-900 rounded-3xl mt-6 text-center border border-dashed border-emerald-500/30">
                    <p class="text-white font-bold">🔒 Unlock Full Legal Counsel</p>
                    <p class="text-slate-500 text-xs mt-1">Get 2 deep-dives for KSh 20</p>
                    <input type="tel" id="phone" placeholder="07XXXXXXXX" class="mt-4 p-3 bg-slate-800 rounded-xl text-white text-center">
                    <button onclick="pay()" class="block w-full mt-3 emerald-bg text-slate-950 font-bold py-3 rounded-xl">Pay with M-Pesa</button>
                    <div id="pStat" class="text-xs mt-2"></div>
                </div>`;
            }
            resDiv.innerHTML = html;
        } catch (e) { resDiv.innerHTML = "Error processing request."; }
        finally { btn.disabled = false; }
    }

    // Include your existing Pay() and check_payment() logic here...
</script>
</body>
</html>
