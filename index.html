<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SheriaHub | Nairobi Survival</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --red: #ff4757; --green: #2ed573; }
        body { font-family: 'Poppins', sans-serif; background: #111; color: white; margin: 0; overflow: hidden; }
        
        /* Game Stats Bar */
        .stats { display: flex; justify-content: space-around; padding: 15px; background: rgba(0,0,0,0.5); font-size: 14px; }
        .stat-item { display: flex; align-items: center; gap: 5px; }

        /* The Game Card */
        .game-container { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; color: #333; width: 100%; max-width: 320px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .scene-text { font-size: 18px; margin-bottom: 30px; line-height: 1.4; min-height: 60px; }
        
        .choice-btn { width: 100%; padding: 15px; margin-bottom: 12px; border: none; border-radius: 15px; font-family: inherit; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; background: #f0f2f5; }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn.a { border-left: 6px solid var(--gold); }
        .choice-btn.b { border-left: 6px solid var(--navy); }

        /* Outcome Overlay */
        #outcome { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; text-align: center; z-index: 200; }
        
        .loader { border: 4px solid #333; border-top: 4px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="stats">
        <div class="stat-item">💰 <span id="money">2000</span></div>
        <div class="stat-item">❤️ <span id="life">3</span></div>
        <div class="stat-item">⚖️ SheriaHub</div>
    </div>

    <div class="game-container">
        <div class="card" id="gameCard">
            <div id="loader" class="loader"></div>
            <div id="scene" class="scene-text">Walking through CBD with a laptop bag...</div>
            <div id="controls" style="display:none;">
                <button class="choice-btn a" id="btnA" onclick="handleChoice('A')">Option A</button>
                <button class="choice-btn b" id="btnB" onclick="handleChoice('B')">Option B</button>
            </div>
        </div>
    </div>

    <div id="outcome" onclick="nextStep()">
        <div>
            <h2 id="outcomeTitle">Outcome</h2>
            <p id="outcomeText"></p>
            <p style="font-size: 12px; color: #888;">Tap to continue...</p>
        </div>
    </div>

    <script>
        const API = "https://sheriahub.onrender.com"; // UPDATE THIS
        let gameState = { money: 2000, life: 3, currentData: null };

        async function nextStep() {
            document.getElementById('outcome').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('scene').innerText = "";
            document.getElementById('controls').style.display = 'none';

            try {
                const res = await fetch(`${API}/game-step`, { method: "POST" });
                const data = await res.json();
                gameState.currentData = data;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('scene').innerText = data.scene;
                document.getElementById('btnA').innerText = data.A;
                document.getElementById('btnB').innerText = data.B;
                document.getElementById('controls').style.display = 'block';
            } catch (e) {
                document.getElementById('scene').innerText = "Connection lost. Tap to try again.";
            }
        }

        function handleChoice(choice) {
            const result = choice === 'A' ? gameState.currentData.resultA : gameState.currentData.resultB;
            
            // Update Stats
            gameState.money += result.money;
            gameState.life += result.life;

            // Update UI
            document.getElementById('money').innerText = gameState.money;
            document.getElementById('life').innerText = gameState.life;
            document.getElementById('outcomeText').innerText = result.text;
            document.getElementById('outcomeTitle').innerText = (result.money < 0 || result.life < 0) ? "Ouch! 🤕" : "Nice! 😎";
            document.getElementById('outcome').style.display = 'flex';

            if (gameState.life <= 0) {
                alert("Game Over! You were deported to the village.");
                location.reload();
            }
        }

        // Start game
        nextStep();
    </script>
</body>
</html>
