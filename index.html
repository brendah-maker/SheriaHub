<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub - Legal AI</title>
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --light: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; background: var(--light); margin: 0; padding: 0; }
        .nav { background: var(--navy); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .hero { text-align: center; margin-bottom: 30px; }
        .input-box { width: 100%; border: 2px solid #ddd; border-radius: 8px; padding: 15px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { background: var(--navy); color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn:disabled { opacity: 0.6; }
        #responseArea { margin-top: 25px; line-height: 1.6; }
        .paywall { background: #fffbeb; border: 1px solid var(--gold); padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; }
        .cat-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .cat-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; background: white; cursor: pointer; }
        .cat-btn.active { background: var(--gold); border-color: var(--gold); color: white; }
    </style>
</head>
<body>

<nav class="nav">
    <h2>⚖️ SheriaHub</h2>
    <span>Legal Intelligence Kenya</span>
</nav>

<div class="container">
    <div class="hero">
        <h1>Know Your Rights in Seconds.</h1>
        <p>Get instant guidance on Tenant and Employment law.</p>
    </div>

    <div class="cat-btns">
        <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Housing</button>
        <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Job/Labor</button>
    </div>

    <textarea id="question" class="input-box" rows="3" placeholder="Explain your situation..."></textarea>
    <button id="askBtn" class="btn" onclick="askSheria()">Consult AI</button>

    <div id="responseArea"></div>
</div>

<script>
    const API_BASE = "https://sheriahub.onrender.com";
    let currentCat = "tenant";
    let paidContent = "";

    function setCat(cat) {
        currentCat = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${cat}`).classList.add('active');
    }

    async function askSheria() {
        const q = document.getElementById("question").value;
        const out = document.getElementById("responseArea");
        const btn = document.getElementById("askBtn");

        if(!q) return alert("Please type a question.");

        btn.disabled = true;
        out.innerHTML = "⏳ Analyzing statutes and case law...";

        try {
            const res = await fetch(`${API_BASE}/ask-ai`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: q, category: currentCat })
            });

            const data = await res.json();
            
            if (data.error) {
                out.innerHTML = `<p style="color:red;">❌ ${data.error}</p>`;
            } else {
                paidContent = data.paid_deep_dive;
                out.innerHTML = `
                    <div style="background:#f9fafb; padding:15px; border-radius:8px; border-left:4px solid var(--navy);">
                        <strong>Summary:</strong><br>${data.free_summary}
                    </div>
                    <div class="paywall">
                        <h3>Unlock Full Legal Action Plan</h3>
                        <p>Get specific law citations and tribunal steps via M-Pesa (KSh 20).</p>
                        <button class="btn" style="background:var(--gold); color:navy;" onclick="pay()">Pay KSh 20</button>
                    </div>
                `;
            }
        } catch (e) {
            out.innerHTML = "❌ Connection failed. Ensure the Render server is awake.";
        } finally {
            btn.disabled = false;
        }
    }

    async function pay() {
        const phone = prompt("Enter Safaricom Number (07xx...)");
        if(!phone) return;

        const out = document.getElementById("responseArea");
        try {
            const res = await fetch(`${API_BASE}/stkpush`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phone, amount: 20 })
            });
            const data = await res.json();
            
            if(data.checkout_id) {
                out.innerHTML = "⏳ Check your phone for the M-Pesa PIN prompt...";
                pollPayment(data.checkout_id);
            }
        } catch (e) { alert("Payment initiation failed."); }
    }

    function pollPayment(id) {
        const timer = setInterval(async () => {
            const res = await fetch(`${API_BASE}/check-payment/${id}`);
            const data = await res.json();
            if(data.status === "paid") {
                clearInterval(timer);
                document.getElementById("responseArea").innerHTML = `
                    <div style="background:#ecfdf5; padding:20px; border-radius:8px; border:1px solid #10b981;">
                        <h3 style="color:#065f46;">✅ Full Analysis Unlocked</h3>
                        <p>${paidContent}</p>
                    </div>`;
            } else if(data.status === "failed") {
                clearInterval(timer);
                alert("Payment was not successful.");
            }
        }, 3000);
    }
</script>
</body>
</html>
