<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Legal Game Center</title>
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; line-height: 1.6; margin: 0; padding-bottom: 50px; }
        .nav { background: var(--navy); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--gold); margin-bottom: 30px; }
        .card { max-width: 650px; margin: 0 auto 25px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-navy { background: var(--navy); color: white; }
        .btn-gold { background: var(--gold); color: white; }
        .game-area { background: #fffcf0; padding: 20px; border: 1px dashed #cbd5e1; border-radius: 12px; margin-top: 15px; font-family: 'Courier New', monospace; }
        .red-flag { cursor: pointer; background: transparent; transition: 0.2s; border-radius: 4px; padding: 0 2px; }
        .red-flag:hover { background: #fef3c7; }
        .found { background: #fee2e2 !important; color: #991b1b !important; pointer-events: none; }
        #fact-box { background: var(--navy); color: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 15px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="nav"><h1>⚖️ SheriaHub Kenya</h1></div>

<div class="card">
    <h3 style="margin-top:0;">1. Jua Mechi (Red Flags)</h3>
    <div id="jua-area" class="game-area">Loading legal case...</div>
    <p id="jua-status" style="font-weight:bold; color:var(--navy);">Flags Found: 0/3</p>
    <button class="btn btn-gold" onclick="loadJua()">Refresh Case</button>
</div>

<div class="card">
    <h3 style="margin-top:0;">2. Fact or Fallacy</h3>
    <div id="fact-box">Loading mystery...</div>
    <div style="display:flex; gap:10px;">
        <button class="btn" style="background:#10b981; color:white;" onclick="checkFact(true)">FACT</button>
        <button class="btn" style="background:#ef4444; color:white;" onclick="checkFact(false)">FALLACY</button>
    </div>
    <div id="fact-exp" style="display:none; margin-top:15px; padding:15px; background:#f1f5f9; border-radius:8px;"></div>
    <button class="btn btn-navy" onclick="loadFact()">Next Challenge</button>
</div>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let currentCat = "tenant";
    let flagsFound = 0;
    let currentFact = null;

    async function loadJua() {
        const area = document.getElementById("jua-area");
        flagsFound = 0;
        document.getElementById("jua-status").innerText = "Flags Found: 0/3";
        area.innerHTML = "⏳ Scanning statutes...";
        
        try {
            const r = await fetch(`${API}/generate-jua-mechi?category=${currentCat}`);
            const d = await r.json();
            let content = d.contract_html;
            d.red_flags.forEach((flag, i) => {
                const regex = new RegExp(flag, 'g');
                content = content.replace(regex, `<span class="red-flag" onclick="handleFlag(this, '${d.explanations[i]}')">${flag}</span>`);
            });
            area.innerHTML = content;
        } catch(e) { area.innerHTML = "❌ Error loading case."; }
    }

    function handleFlag(el, msg) {
        if(el.classList.contains('found')) return;
        el.classList.add('found');
        flagsFound++;
        document.getElementById("jua-status").innerText = `Flags Found: ${flagsFound}/3`;
        alert(`🚩 CORRECT!\n\nWhy: ${msg}`);
    }

    async function loadFact() {
        document.getElementById("fact-exp").style.display = "none";
        document.getElementById("fact-box").innerText = "⏳ Inspecting myths...";
        try {
            const r = await fetch(`${API}/get-fact-fallacy?category=${currentCat}`);
            currentFact = await r.json();
            document.getElementById("fact-box").innerText = currentFact.statement;
        } catch(e) { document.getElementById("fact-box").innerText = "❌ Connection lost."; }
    }

    function checkFact(choice) {
        const exp = document.getElementById("fact-exp");
        exp.style.display = "block";
        const isCorrect = choice === currentFact.is_fact;
        exp.innerHTML = `<strong>${isCorrect ? '✅ Correct!' : '❌ Incorrect'}</strong><br>${currentFact.explanation}`;
    }

    window.onload = () => { loadJua(); loadFact(); };
</script>
</body>
</html>
