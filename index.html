<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | AI Legal Intelligence & Survival Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; --white: #ffffff; --text: #2d3748; --red: #e53e3e; --green: #38a169; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; min-height: 100vh; color: var(--text); line-height: 1.6; }
        h1, h2, h3, .navbar-brand { font-family: 'Poppins', sans-serif; }
        
        /* Navigation */
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        .hero { background: var(--navy); color: white; text-align: center; padding: 50px 20px 100px; }
        .hero h1 { margin: 0; font-size: 2.2rem; }

        /* Categories */
        .category-selector { display: flex; justify-content: center; gap: 10px; margin: -40px auto 30px; padding: 0 15px; flex-wrap: wrap; z-index: 10; position: relative; max-width: 1000px; }
        .cat-btn { padding: 12px 20px; border-radius: 30px; border: 2px solid var(--gold); background: var(--white); cursor: pointer; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 0.9rem; }
        .cat-btn.active { background: var(--gold); color: black; transform: translateY(-2px); }

        /* Main UI */
        .chat-container { width: 95%; max-width: 700px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 130px; padding: 18px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; margin-bottom: 15px; resize: none; outline: none; font-family: inherit; }
        .ask-btn { width: 100%; padding: 16px; background: var(--navy); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.1rem; transition: 0.3s; }
        .ask-btn:disabled { background: #cbd5e0; }

        /* AI Results */
        .legal-card { padding: 25px; border-left: 6px solid var(--navy); background: #f8fafc; margin-top: 25px; border-radius: 12px; }
        .paywall { background: #fffbeb; border: 2px dashed var(--gold); padding: 35px; border-radius: 15px; margin-top: 25px; text-align: center; }
        .premium-content { background: #f0fff4; border: 2px solid #38a169; padding: 30px; border-radius: 15px; margin-top: 25px; line-height: 1.8; white-space: pre-wrap; }
        .credits-badge { background: var(--gold); padding: 6px 14px; border-radius: 8px; font-weight: 700; display: inline-block; margin-bottom: 12px; font-size: 0.85rem; }

        /* WIDGET GAME STYLING */
        .widget-bubble { position: fixed; bottom: 30px; right: 30px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 2000; transition: 0.3s; }
        .widget-window { position: fixed; bottom: 110px; right: 30px; width: 360px; height: 520px; background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 2001; border: 1px solid #e2e8f0; overflow: hidden; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .widget-header { background: var(--navy); color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: 700; }
        .widget-body { flex: 1; padding: 20px; overflow-y: auto; background: #fcfcfc; transition: background 0.5s ease; }
        
        .bribe-meter { font-size: 1.2rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .lvl-tag { background: #e2e8f0; padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; color: var(--navy); }
        
        .game-opt { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; }
        .game-opt:hover { border-color: var(--gold); background: #fffcf0; }
        
        /* Flash animations */
        .flash-correct { background: #c6f6d5 !important; }
        .flash-wrong { background: #fed7d7 !important; }

        .footer { background: var(--navy); color: white; text-align: center; padding: 50px 20px; border-top: 6px solid var(--gold); margin-top: auto; }
        @media (max-width: 600px) { .hero h1 { font-size: 1.6rem; } .category-selector { margin-top: -50px; } .widget-window { width: 90%; right: 5%; bottom: 100px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">⚖️ SheriaHub</div>
        <div style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px;">KENYA 🇰🇪</div>
    </nav>

    <div class="main-content">
        <header class="hero">
            <h1>Legal Rights, Simplified.</h1>
            <p>Access Law Analysis or test your skills in the <strong>Sheria Survival Game</strong>.</p>
        </header>

        <div class="category-selector">
            <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy</button>
            <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Employment</button>
            <button class="cat-btn" id="btn-family" onclick="setCat('family')">👨‍👩‍👧 Family</button>
            <button class="cat-btn" id="btn-traffic" onclick="setCat('traffic')">🚗 Traffic</button>
            <button class="cat-btn" id="btn-civil_criminal" onclick="setCat('civil_criminal')">⚖️ Civil/Criminal</button>
        </div>

        <main class="chat-container">
            <textarea id="q" placeholder="Ask about rent, deposits, or evictions..."></textarea>
            <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
            <div id="res"></div>
        </main>
    </div>

    <!-- SURVIVAL GAME WIDGET -->
    <div class="widget-bubble" onclick="toggleWidget()">🎮</div>
    <div id="gameWidget" class="widget-window">
        <div class="widget-header"><span>Sheria Survival Game</span><span style="cursor:pointer;" onclick="toggleWidget()">✕</span></div>
        <div id="gameBody" class="widget-body">
            <div class="bribe-meter">
                <span id="lives">💰💰💰</span>
                <span id="rank" class="lvl-tag">Common Mwananchi</span>
            </div>
            <p id="gameText">Select your survival path to begin:</p>
            <div id="gameControls">
                <button class="game-opt" onclick="startGame('Street Smarts')">🏙️ Street Smarts</button>
                <button class="game-opt" onclick="startGame('Tenant Trials')">🏠 Tenant Trials</button>
                <button class="game-opt" onclick="startGame('Office Survival')">💼 Office Survival</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 SheriaHub Kenya | Built for Justice</p>
    </footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let cat = "tenant";
    let gameLives = 3;
    let gameScore = 0;
    let lastGameQ = "";
    let activePath = "";

    const savePaidId = (id) => localStorage.setItem('sheria_payment_id', id);
    const getPaidId = () => localStorage.getItem('sheria_payment_id');

    function toggleWidget() {
        const w = document.getElementById("gameWidget");
        w.style.display = (w.style.display === "flex") ? "none" : "flex";
    }

    function setCat(c) {
        cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
        const p = { tenant: "Ask about rent...", employment: "Ask about dismissal...", family: "Ask about custody...", traffic: "Ask about fines...", civil_criminal: "Ask about theft..." };
        document.getElementById("q").placeholder = p[c];
    }

    async function askAi() {
        const q = document.getElementById("q").value;
        const resDiv = document.getElementById("res");
        if (!q) return;
        resDiv.innerHTML = "<p style='text-align:center;'>⚖️ Analyzing...</p>";
        try {
            const res = await fetch(`${API}/ask-ai`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ question: q, category: cat, checkout_id: getPaidId() }) });
            const data = await res.json();
            if (data.status === "premium") resDiv.innerHTML = `<div class="premium-content"><h3>📋 Result</h3>${data.content.replace(/\n/g, '<br>')}</div>`;
            else resDiv.innerHTML = `<div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div><div class="paywall"><h4>🔒 Unlock Full Details</h4><p>KSh 20 for 2 Credits</p><button class="ask-btn">Pay via M-Pesa</button></div>`;
        } catch (e) { resDiv.innerHTML = "Error. Try again."; }
    }

    // GAME LOGIC
    function startGame(path) {
        activePath = path;
        gameLives = 3;
        gameScore = 0;
        updateGameUI();
        gameCycle('START');
    }

    function updateGameUI() {
        document.getElementById("lives").innerText = "💰".repeat(gameLives);
        const ranks = ["Common Mwananchi", "Street Lawyer", "Constitution Guard", "Sheria Chief Justice"];
        document.getElementById("rank").innerText = ranks[Math.min(Math.floor(gameScore/2), 3)];
    }

    async function gameCycle(input) {
        const text = document.getElementById("gameText");
        const controls = document.getElementById("gameControls");
        const body = document.getElementById("gameBody");

        text.innerHTML = "⏳ Generating scenario...";
        controls.innerHTML = "";

        const payloadQ = (input === 'START') ? `NEW GAME in ${activePath}` : `I choose ${input}. The question was: ${lastGameQ}`;

        try {
            const res = await fetch(`${API}/ask-ai`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ question: payloadQ, category: "game" }) });
            const data = await res.json();
            
            // Result Feedback
            if (input !== 'START') {
                if (data.summary.toUpperCase().includes("CORRECT")) {
                    gameScore++;
                    body.classList.add("flash-correct");
                    setTimeout(() => body.classList.remove("flash-correct"), 1000);
                } else {
                    gameLives--;
                    body.classList.add("flash-wrong");
                    setTimeout(() => body.classList.remove("flash-wrong"), 1000);
                }
                updateGameUI();
            }

            if (gameLives <= 0) {
                text.innerHTML = "💸 <strong>Game Over!</strong> You've been cleaned out by bribes. Better luck next time!";
                controls.innerHTML = `<button class="ask-btn" onclick="location.reload()">Reset Game 🔄</button>`;
                return;
            }

            text.innerHTML = data.summary.replace(/\n/g, '<br>');
            lastGameQ = data.summary;

            if (input === 'START' || !data.summary.includes('?')) {
                controls.innerHTML = `<button class="game-opt" onclick="gameCycle('Option A')">A</button><button class="game-opt" onclick="gameCycle('Option B')">B</button><button class="game-opt" onclick="gameCycle('Option C')">C</button>`;
            } else {
                controls.innerHTML = `<button class="ask-btn" onclick="gameCycle('START')">Next Challenge ⏭️</button>`;
            }
        } catch (e) { text.innerHTML = "Server connection lost. Try again."; }
    }
</script>
</body>
</html>
