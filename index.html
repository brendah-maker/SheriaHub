<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | AI & Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --red: #ff4757; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; margin: 0; }
        
        /* Floating Bubble */
        .widget-bubble { 
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--red); width: 60px; height: 60px; 
            border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-size: 28px; cursor: pointer; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); z-index: 1000;
            border: 2px solid white;
        }

        /* Widget Window */
        .widget-window { 
            position: fixed; bottom: 90px; right: 20px; 
            width: 300px; height: 420px; background: white; 
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            display: none; flex-direction: column; overflow: hidden; 
            z-index: 1001; border: 1px solid #eee;
        }

        /* Game Header & Stats */
        .widget-header { background: var(--navy); color: white; padding: 12px; font-size: 13px; }
        .stats-bar { display: flex; justify-content: space-around; background: #051024; padding: 5px; font-size: 11px; }

        .widget-body { flex: 1; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        
        .scene-text { font-size: 15px; color: #333; margin-bottom: 20px; line-height: 1.4; font-weight: 600; }
        
        .choice-btn { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            border: none; border-radius: 12px; font-family: inherit; 
            font-weight: bold; font-size: 13px; cursor: pointer;
            background: #f0f2f5; transition: 0.2s;
        }
        .choice-btn:active { transform: scale(0.95); }

        /* Outcome Overlay */
        #overlay { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: rgba(10, 31, 68, 0.95); color: white; 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; padding: 20px; box-sizing: border-box; text-align: center;
        }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--gold); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Main Website Content (Optional) -->
    <div style="padding: 50px; text-align: center;">
        <h1>SheriaHub Kenya</h1>
        <p>Your AI Legal Assistant is in the bottom right bubble.</p>
    </div>

    <!-- The Widget Bubble -->
    <div class="widget-bubble" onclick="toggleWidget()">👮</div>

    <!-- The Widget Window -->
    <div id="widgetWin" class="widget-window">
        <div class="widget-header">
            <div style="display:flex; justify-content:space-between;">
                <span>Nairobi Survival</span>
                <span onclick="toggleWidget()" style="cursor:pointer">✕</span>
            </div>
        </div>
        <div class="stats-bar">
            <span>💰 Cash: <b id="money">2000</b></span>
            <span>❤️ Life: <b id="life">3</b></span>
        </div>

        <div class="widget-body">
            <div id="loader" class="loader"></div>
            <div id="scene" class="scene-text"></div>
            <div id="actions" style="display:none;">
                <button class="choice-btn" id="btnA" onclick="makeChoice('A')" style="border-left: 4px solid var(--gold);"></button>
                <button class="choice-btn" id="btnB" onclick="makeChoice('B')" style="border-left: 4px solid var(--navy);"></button>
            </div>
            
            <!-- Result Overlay -->
            <div id="overlay" onclick="loadNextScene()">
                <h3 id="resTitle" style="margin:0;">Outcome</h3>
                <p id="resMsg" style="font-size: 13px;"></p>
                <p style="font-size: 10px; color: var(--gold);">Tap to continue...</p>
            </div>
        </div>
    </div>

    <script>
        const API = "https://sheriahub.onrender.com"; // UPDATE TO YOUR URL
        let state = { cash: 2000, life: 3, current: null };

        function toggleWidget() {
            const w = document.getElementById("widgetWin");
            const isHidden = w.style.display === "none" || w.style.display === "";
            w.style.display = isHidden ? "flex" : "none";
            if (isHidden && !state.current) loadNextScene();
        }

        async function loadNextScene() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('scene').innerText = "";
            document.getElementById('actions').style.display = 'none';

            try {
                const res = await fetch(`${API}/game-step`, { method: "POST" });
                const data = await res.json();
                state.current = data;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('scene').innerText = data.scene;
                document.getElementById('btnA').innerText = data.A;
                document.getElementById('btnB').innerText = data.B;
                document.getElementById('actions').style.display = 'block';
            } catch (e) {
                document.getElementById('scene').innerText = "Network error. Try again.";
            }
        }

        function makeChoice(choice) {
            const res = choice === 'A' ? state.current.resA : state.current.resB;
            
            state.cash += res.cash;
            state.life += res.hp;

            document.getElementById('money').innerText = state.cash;
            document.getElementById('life').innerText = state.life;
            document.getElementById('resMsg').innerText = res.msg;
            document.getElementById('resTitle').innerText = (res.cash < 0 || res.hp < 0) ? "Ouch! 🤕" : "Nice! 😎";
            document.getElementById('overlay').style.display = 'flex';

            if (state.life <= 0) {
                alert("Game Over! You've been sent to the village.");
                location.reload();
            }
        }
    </script>
</body>
</html>
