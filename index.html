<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Legal Games & AI</title>
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .nav { background: var(--navy); color: white; padding: 1rem; text-align: center; border-bottom: 4px solid var(--gold); }
        .container { max-width: 700px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-navy { background: var(--navy); color: white; }
        .btn-gold { background: var(--gold); color: white; }
        .game-box { border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .red-flag { cursor: pointer; text-decoration: underline dotted; }
        .found { background: #feb2b2; color: #9b2c2c; border-radius: 4px; padding: 0 4px; text-decoration: none; }
        #fact-card { background: var(--navy); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="nav"><h1>⚖️ SheriaHub Kenya</h1></div>

<div class="container">
    <h3>1. Ask Sheria AI</h3>
    <textarea id="q" style="width:100%; height:80px; padding:10px; border-radius:8px; border:1px solid #ddd;" placeholder="Ask about rent, labor, or traffic..."></textarea>
    <button class="btn btn-navy" style="width:100%; margin-top:10px;" onclick="askAi()">Get Quick Advice</button>
    <div id="ai-res" style="margin-top:15px; font-style: italic;"></div>
</div>

<div class="container">
    <h3>2. Jua Mechi (Spot 3 Errors)</h3>
    <div id="jua-mechi-content" class="game-box">Loading contract...</div>
    <div id="jua-status" style="margin-top:10px; font-weight:bold;">Found: 0/3</div>
    <button class="btn btn-gold" style="margin-top:10px;" onclick="loadJuaMechi()">New Contract</button>
</div>

<div class="container" style="background: #eef2f3;">
    <h3>3. Fact or Fallacy?</h3>
    <div id="fact-card">Click a button to start</div>
    <div id="fact-controls" style="display:flex; gap:10px;">
        <button class="btn" style="flex:1; background:#2ecc71; color:white;" onclick="checkFact(true)">FACT</button>
        <button class="btn" style="flex:1; background:#e74c3c; color:white;" onclick="checkFact(false)">FALLACY</button>
    </div>
    <div id="fact-explanation" style="margin-top:15px; display:none; padding:10px; background:white; border-radius:8px;"></div>
    <button class="btn btn-navy" style="width:100%; margin-top:10px;" onclick="loadFactGame()">Next Question</button>
</div>

<script>
    const API = "https://sheriahub.onrender.com"; // Change to your Render URL
    let currentCat = "tenant";
    let flagsFound = 0;
    let currentFact = null;

    async function askAi() {
        const q = document.getElementById("q").value;
        const resDiv = document.getElementById("ai-res");
        resDiv.innerText = "⏳ Consulting statutes...";
        const r = await fetch(`${API}/ask-ai`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question: q, category: currentCat})
        });
        const data = await r.json();
        resDiv.innerText = data.summary;
    }

    async function loadJuaMechi() {
        const box = document.getElementById("jua-mechi-content");
        flagsFound = 0;
        document.getElementById("jua-status").innerText = "Found: 0/3";
        box.innerHTML = "⏳ Drafting...";
        const r = await fetch(`${API}/generate-jua-mechi?category=${currentCat}`);
        const d = await r.json();
        let html = d.contract_html;
        d.red_flags.forEach((f, i) => {
            html = html.replace(f, `<span class="red-flag" onclick="foundFlag(this, '${d.explanations[i]}')">${f}</span>`);
        });
        box.innerHTML = html;
    }

    function foundFlag(el, msg) {
        if(el.classList.contains('found')) return;
        el.classList.add('found');
        flagsFound++;
        document.getElementById("jua-status").innerText = `Found: ${flagsFound}/3`;
        alert(`🎯 Correct! ${msg}`);
    }

    async function loadFactGame() {
        document.getElementById("fact-explanation").style.display = "none";
        document.getElementById("fact-card").innerText = "⏳ Fetching myth...";
        const r = await fetch(`${API}/get-fact-fallacy?category=${currentCat}`);
        currentFact = await r.json();
        document.getElementById("fact-card").innerText = currentFact.statement;
    }

    function checkFact(val) {
        const exp = document.getElementById("fact-explanation");
        exp.style.display = "block";
        if(val === currentFact.is_fact) {
            exp.innerHTML = `✅ <b>Correct!</b><br>${currentFact.explanation}`;
        } else {
            exp.innerHTML = `❌ <b>Wrong!</b><br>${currentFact.explanation}`;
        }
    }

    window.onload = () => { loadJuaMechi(); loadFactGame(); };
</script>
</body>
</html>
