<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Kenya</title>
    <style>
        :root { --main: #0a1f44; --accent: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .box { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: var(--main); text-align: center; }
        input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: var(--main); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .result-card { margin-top: 25px; padding: 20px; border-radius: 10px; background: #f9fafb; border-left: 5px solid var(--main); }
        .paywall { text-align: center; background: #fffdf5; border: 2px dashed var(--accent); padding: 20px; border-radius: 10px; margin-top: 20px; }
        .unlocked { background: #f0fff4; border-left: 5px solid #27ae60; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚖️ SheriaHub</h2>
        <p style="text-align:center;">Kenyan Tenant & Landlord Rights Assistant</p>
        <input type="text" id="q" placeholder="Ask e.g. 'Can my landlord increase rent yearly?'">
        <button onclick="ask()">Consult Sheria AI</button>
        <div id="out"></div>
    </div>

    <script>
        const API = "https://sheriahub.onrender.com";
        let deepDive = "";

        async function ask() {
            const q = document.getElementById("q").value;
            const out = document.getElementById("out");
            if(!q) return;

            out.innerHTML = "<p style='text-align:center;'>⏳ Statutes search in progress...</p>";

            try {
                const res = await fetch(`${API}/ask-ai`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                deepDive = data.paid_deep_dive;

                out.innerHTML = `
                    <div class="result-card">
                        <strong>Overview:</strong><br><p>${data.free_summary}</p>
                    </div>
                    <div class="paywall" id="pw">
                        <h4>🔒 Unlock Detailed Legal Procedure</h4>
                        <p>Get law citations and tribunal steps for KSh 20.</p>
                        <button style="background:var(--accent)" onclick="pay()">Pay with M-Pesa</button>
                    </div>
                `;
            } catch(e) { out.innerHTML = "❌ System Error. Backend might be sleeping."; }
        }

        async function pay() {
            const phone = prompt("Enter M-Pesa Number (2547...)");
            if(!phone) return;

            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ phone })
            });
            const data = await res.json();

            if(data.checkout_id) {
                const poll = setInterval(async () => {
                    const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
                    const status = await check.json();
                    if(status.status === "paid") {
                        clearInterval(poll);
                        document.getElementById("pw").innerHTML = `<div class="unlocked"><strong>✅ Full Guidance:</strong><br><p>${deepDive.replace(/\n/g, '<br>')}</p></div>`;
                    }
                }, 3000);
            }
        }
    </script>
</body>
</html>
