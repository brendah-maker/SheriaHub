<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheriaHub - Kenya's Legal AI</title>
<style>
:root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; }
body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; }

.navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gold); }
.hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 60px; }

.category-selector { display: flex; justify-content: center; gap: 10px; margin: -25px auto 20px; padding: 0 15px; }
.cat-btn { flex: 1; max-width: 180px; padding: 12px; border-radius: 25px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
.cat-btn.active { background: var(--gold); color: black; }

.chat-container { max-width: 90%; width: 650px; margin: 0 auto 30px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

/* RESPONSIVE TEXTAREA */
textarea { 
    width: 100%; 
    min-height: 80px; 
    padding: 12px; 
    border-radius: 8px; 
    border: 2px solid #ddd; 
    box-sizing: border-box; /* Crucial for mobile sizing */
    font-size: 16px; 
    font-family: inherit;
    resize: vertical;
    margin-bottom: 10px;
}
textarea:focus { outline: none; border-color: var(--gold); }

.ask-btn { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }

#responseArea { margin-top: 20px; }
.paywall { background: #fffdf2; border: 2px dashed var(--gold); padding: 20px; border-radius: 10px; text-align: center; margin-top: 15px; }

.footer { background: var(--navy); color: white; text-align: center; padding: 30px; border-top: 4px solid var(--gold); font-size: 0.8rem; }
</style>
</head>
<body>

<div class="navbar"><strong>⚖️ SheriaHub</strong></div>
<div class="hero">
  <h1 style="font-size: 1.6rem; margin:0;">Legal Intelligence</h1>
  <p style="opacity:0.8;">Tenant & Employment Law Kenya</p>
</div>

<div class="category-selector">
  <button class="cat-btn active" id="t-btn" onclick="setCat('tenant')">🏠 Tenant</button>
  <button class="cat-btn" id="e-btn" onclick="setCat('employment')">💼 Job Law</button>
</div>

<div class="chat-container">
  <textarea id="question" placeholder="Ask your question here..."></textarea>
  <button class="ask-btn" onclick="askSheria()">Consult AI</button>
  <div id="responseArea"></div>
</div>

<footer class="footer">
  <p>© 2026 SheriaHub Kenya | Powered by Gemini 2.5 Flash</p>
</footer>

<script>
const API = "https://sheriahub.vercel.app"; // Update to your actual Vercel URL
let category = "tenant";
let price = 20;
let deepDive = "";

function setCat(c) {
    category = c;
    price = (c === 'tenant') ? 20 : 50;
    document.getElementById('t-btn').classList.toggle('active', c === 'tenant');
    document.getElementById('e-btn').classList.toggle('active', c === 'employment');
}

async function askSheria() {
    const q = document.getElementById("question").value;
    const out = document.getElementById("responseArea");
    if(!q) return;

    out.innerHTML = "<p style='text-align:center;'>⏳ Analyzing...</p>";

    try {
        const res = await fetch(`${API}/ask-ai`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ question: q, category: category })
        });
        const data = await res.json();
        deepDive = data.paid_deep_dive;

        out.innerHTML = `
            <div style="padding:15px; border-left:4px solid var(--navy); background:#f9fafb;">
                <strong>Summary:</strong><br>${data.free_summary}
            </div>
            <div class="paywall">
                <h4>🔒 Unlock Action Plan</h4>
                <p>KSh ${price} for full guidance.</p>
                <button class="ask-btn" style="background:var(--gold); color:black;" onclick="startPayment()">
                    Pay via M-Pesa
                </button>
                <div id="p-status" style="margin-top:10px; font-weight:bold;"></div>
            </div>
        `;
    } catch(e) { out.innerHTML = "❌ Connection failed."; }
}

async function startPayment() {
    const phone = prompt("Enter M-Pesa Number (2547...)");
    if(!phone) return;
    
    const status = document.getElementById("p-status");
    status.innerText = "⏳ Requesting M-Pesa PIN...";

    try {
        const res = await fetch(`${API}/stkpush`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ phone: phone, amount: price })
        });
        const data = await res.json();
        
        if(!data.checkout_id) {
            status.innerText = "❌ STK Push failed.";
            return;
        }

        const poll = setInterval(async () => {
            const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
            const result = await check.json();
            if(result.status === "paid") {
                clearInterval(poll);
                document.getElementById("responseArea").innerHTML = `
                    <div style="background:#e7f9ee; border-left:5px solid #27ae60; padding:20px;">
                        <h3>✅ Full Advice Unlocked</h3>
                        <p>${deepDive.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
            } else if(result.status === "failed") {
                clearInterval(poll);
                status.innerText = "❌ Payment failed.";
            }
        }, 3000);
    } catch(e) { status.innerText = "❌ Payment system error."; }
}
</script>
</body>
</html>
