<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | AI Legal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .nav { background: var(--navy); color: white; padding: 15px 5%; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; }
        .hero { background: var(--navy); color: white; text-align: center; padding: 50px 20px 80px; }
        .container { max-width: 700px; margin: -50px auto 20px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        
        /* Kanjo Game UI */
        .game-card { border-top: 6px solid var(--gold); margin-top: 30px; padding: 25px; background: #fff; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .choice-btn { width: 100%; text-align: left; padding: 14px; margin-top: 10px; border: 1px solid #cbd5e0; border-radius: 10px; background: #fdfdfd; cursor: pointer; font-weight: 500; }
        .choice-btn:hover { border-color: var(--gold); background: #fffdf2; }
        .res-box { display: none; margin-top: 20px; padding: 20px; border-radius: 12px; background: #f0f7ff; border-left: 5px solid var(--gold); }
    </style>
</head>
<body>

<nav class="nav"><div style="font-weight:700;">⚖️ SheriaHub</div><div>NAIROBI 🇰🇪</div></nav>

<header class="hero">
    <h1 style="margin:0; font-family:'Poppins';">Sheria AI & Street Smarts</h1>
</header>

<div class="container">
    <textarea id="q" placeholder="What legal issue are you facing today?"></textarea>
    <button class="btn" onclick="askAi()">Get AI Consultation</button>
    <div id="ai-res"></div>

    <div class="game-card">
        <h2 style="margin:0; font-family:'Poppins'; color:var(--navy);">🏃 Kanjo Chronicles</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Can you survive a walk through the CBD without "opening your wallet"?</p>
        
        <p id="k-scenario" style="font-weight: 600; font-style: italic;">Loading your morning in Nairobi...</p>
        
        <div id="k-options">
            <button id="opt-a" class="choice-btn" onclick="decide('a')"></button>
            <button id="opt-b" class="choice-btn" onclick="decide('b')"></button>
            <button id="opt-c" class="choice-btn" onclick="decide('c')"></button>
        </div>

        <div id="k-res" class="res-box">
            <h4 style="margin:0;">The Result:</h4>
            <p id="k-outcome"></p>
            <button class="btn" style="padding:10px; margin-top:10px;" onclick="loadGame()">Try to survive again</button>
        </div>
    </div>
</div>

<script>
    const API = "https://sheriahub.onrender.com";
    let state = null;

    async function askAi() {
        const q = document.getElementById("q").value;
        const res = document.getElementById("ai-res");
        res.innerHTML = "⏳ Consulting the statutes...";
        const r = await fetch(`${API}/ask-ai`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question:q}) });
        const d = await r.json();
        res.innerHTML = `<div style="padding:15px; background:#f1f5f9; border-radius:10px; margin-top:15px;">${d.summary}<br><br><i>${d.content}</i></div>`;
    }

    async function loadGame() {
        document.getElementById("k-res").style.display = "none";
        document.getElementById("k-options").style.display = "block";
        document.getElementById("k-scenario").innerText = "⏳ Spotted by an officer...";
        const r = await fetch(`${API}/generate-kanjo`);
        state = await r.json();
        document.getElementById("k-scenario").innerText = state.scenario;
        ['a','b','c'].forEach(l => document.getElementById(`opt-${l}`).innerText = state[`choice_${l}`]);
    }

    function decide(l) {
        document.getElementById("k-options").style.display = "none";
        document.getElementById("k-res").style.display = "block";
        document.getElementById("k-outcome").innerText = state[`outcome_${l}`];
        document.getElementById("k-res").style.borderLeftColor = (l==='c' || l==='C') ? "#2ecc71" : "#e74c3c";
    }

    window.onload = loadGame;
</script>
</body>
</html>
