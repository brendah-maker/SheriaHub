<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | Kenya's AI Legal Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; --white: #ffffff; --text: #2d3748; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; line-height: 1.6; }
        h1, h2, h3, .navbar-brand { font-family: 'Poppins', sans-serif; }
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        .hero { background: var(--navy); color: white; text-align: center; padding: 60px 20px 100px; }
        .hero h1 { margin: 0; font-size: 2.2rem; }
        .main-content { flex: 1; }
        .category-selector { display: flex; justify-content: center; gap: 10px; margin: -40px auto 30px; padding: 0 15px; flex-wrap: wrap; z-index: 10; position: relative; max-width: 1000px; }
        .cat-btn { padding: 12px 20px; border-radius: 30px; border: 2px solid var(--gold); background: var(--white); cursor: pointer; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 0.9rem; }
        .cat-btn.active { background: var(--gold); color: black; transform: translateY(-2px); }
        .chat-container { width: 95%; max-width: 700px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 130px; padding: 18px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; margin-bottom: 15px; resize: none; outline: none; transition: 0.3s; font-family: inherit; }
        .ask-btn { width: 100%; padding: 16px; background: var(--navy); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1.1rem; transition: 0.3s; }
        .ask-btn:disabled { background: #cbd5e0; }
        .legal-card { padding: 25px; border-left: 6px solid var(--navy); background: #f8fafc; margin-top: 25px; border-radius: 12px; }
        .paywall { background: #fffbeb; border: 2px dashed var(--gold); padding: 35px; border-radius: 15px; margin-top: 25px; text-align: center; }
        .premium-content { background: #f0fff4; border: 2px solid #38a169; padding: 30px; border-radius: 15px; margin-top: 25px; line-height: 1.8; white-space: pre-wrap; }
        .footer { background: var(--navy); color: white; text-align: center; padding: 50px 20px; border-top: 6px solid var(--gold); margin-top: auto; }

        /* WIDGET STYLING */
        .widget-bubble { position: fixed; bottom: 30px; right: 30px; background: var(--gold); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 2000; transition: 0.3s; }
        .widget-bubble:hover { transform: scale(1.1) rotate(10deg); }
        .widget-window { position: fixed; bottom: 110px; right: 30px; width: 350px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 2001; overflow: hidden; border: 1px solid #e2e8f0; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .widget-header { background: var(--navy); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .widget-body { flex: 1; padding: 15px; overflow-y: auto; background: #fcfcfc; font-size: 0.9rem; }
        .widget-footer { padding: 10px; border-top: 1px solid #eee; display: flex; gap: 5px; background: white; }
        .widget-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .game-tag { background: var(--gold); color: black; font-weight: 700; padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; margin-bottom: 5px; display: inline-block; }
        
        @media (max-width: 600px) { 
            .widget-window { width: 90%; right: 5%; bottom: 100px; height: 400px; } 
            .widget-bubble { bottom: 20px; right: 20px; width: 55px; height: 55px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">⚖️ SheriaHub</div>
        <div style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px;">KENYA 🇰🇪</div>
    </nav>

    <div class="main-content">
        <header class="hero">
            <h1>Your Legal Rights, Simplified.</h1>
            <p>Consult Kenyan law on Tenancy, Employment, Land, and more.</p>
        </header>

        <div class="category-selector">
            <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy</button>
            <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Employment</button>
            <button class="cat-btn" id="btn-land" onclick="setCat('land')">🌳 Land</button>
            <button class="cat-btn" id="btn-family" onclick="setCat('family')">👨‍👩‍👧 Family</button>
            <button class="cat-btn" id="btn-traffic" onclick="setCat('traffic')">🚗 Traffic</button>
        </div>

        <main class="chat-container">
            <textarea id="q" placeholder="Ask about rent, deposits, or evictions..."></textarea>
            <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
            <div id="res"></div>
        </main>
    </div>

    <!-- GAME WIDGET -->
    <div class="widget-bubble" onclick="toggleWidget()">🎮</div>
    <div id="gameWidget" class="widget-window">
        <div class="widget-header">
            <span style="font-weight:700;">Law vs. Myth Challenge</span>
            <span style="cursor:pointer;" onclick="toggleWidget()">✕</span>
        </div>
        <div id="gameBody" class="widget-body">
            <p>Welcome! Debunk legal myths in Kenya and test your smarts.</p>
            <button class="ask-btn" style="padding:10px; font-size:0.9rem;" onclick="gameAction('NEW GAME')">Start Challenge 🚀</button>
        </div>
        <div class="widget-footer">
            <input type="text" id="gameInput" class="widget-input" placeholder="True or Myth?">
            <button class="ask-btn" style="width:auto; padding:0 15px;" onclick="gameAction()">Send</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 SheriaHub Kenya | Built for Justice</p>
    </footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let cat = "tenant";

    const savePaidId = (id) => localStorage.setItem('sheria_payment_id', id);
    const getPaidId = () => localStorage.getItem('sheria_payment_id');

    function toggleWidget() {
        const w = document.getElementById("gameWidget");
        w.style.display = (w.style.display === "flex") ? "none" : "flex";
    }

    function setCat(c) {
        cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
        const p = { tenant: "Ask about rent...", employment: "Ask about dismissal...", land: "Ask about titles...", family: "Ask about custody...", traffic: "Ask about fines..." };
        document.getElementById("q").placeholder = p[c];
    }

    async function askAi(checkId = null) {
        const qInput = document.getElementById("q");
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        const question = qInput.value;
        if (!question) return;

        btn.disabled = true;
        resDiv.innerHTML = `<p style="text-align:center;">⚖️ Analyzing...</p>`;

        try {
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question, category: cat, checkout_id: getPaidId() })
            });
            const data = await res.json();
            if (data.status === "premium") {
                const formatted = data.content.replace(/\n/g, '<br>');
                resDiv.innerHTML = `<div class="premium-content"><h3>📋 Result</h3>${formatted}</div>`;
            } else {
                resDiv.innerHTML = `<div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div><div class="paywall"><h4>🔒 Unlock Full Details</h4><p>KSh 20 for 2 Credits</p><input type="tel" id="phone" placeholder="07XXXXXXXX" style="padding:10px; width:80%; margin-bottom:12px; border-radius:8px;"><br><button class="ask-btn" onclick="pay()">Pay via M-Pesa</button></div>`;
            }
        } catch (e) { resDiv.innerHTML = "Error. Try again."; }
        finally { btn.disabled = false; }
    }

    async function gameAction(manualMsg = null) {
        const input = document.getElementById("gameInput");
        const body = document.getElementById("gameBody");
        const msg = manualMsg || input.value;
        if(!msg) return;

        body.innerHTML += `<div style="text-align:right; margin-bottom:10px;"><b>You:</b> ${msg}</div>`;
        input.value = "";
        body.innerHTML += `<div id='gameLoading'>⏳ AI thinking...</div>`;
        body.scrollTop = body.scrollHeight;

        try {
            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question: msg, category: "game" })
            });
            const data = await res.json();
            document.getElementById("gameLoading").remove();
            body.innerHTML += `<div style="margin-bottom:15px; background:#f0f4f8; padding:10px; border-radius:10px;"><b>Sheria Bot:</b><br>${data.summary}</div>`;
            body.scrollTop = body.scrollHeight;
        } catch (e) { body.innerHTML += "<div>Error connecting.</div>"; }
    }

    async function pay() {
        const phone = document.getElementById("phone").value;
        if(!phone) return alert("Enter number");
        try {
            const res = await fetch(`${API}/stkpush`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ phone }) });
            const { checkout_id } = await res.json();
            const poller = setInterval(async () => {
                const check = await fetch(`${API}/check-payment/${checkout_id}`);
                const r = await check.json();
                if (r.status === "paid") { clearInterval(poller); savePaidId(checkout_id); askAi(); }
            }, 4000);
        } catch (e) { alert("Payment Failed"); }
    }
</script>
</body>
</html>
