<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | AI & Kanjo Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .nav { background: var(--navy); color: white; padding: 20px 5%; display: flex; justify-content: space-between; border-bottom: 4px solid var(--gold); }
        .hero { background: var(--navy); color: white; text-align: center; padding: 60px 20px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin: -30px 0 30px; flex-wrap: wrap; }
        .tab { padding: 12px 25px; border-radius: 30px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab.active { background: var(--gold); color: white; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; padding: 15px; border-radius: 12px; border: 2px solid #ddd; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .result { margin-top: 25px; line-height: 1.6; }
        .premium-box { background: #e6fffa; border: 2px solid #38b2ac; padding: 20px; border-radius: 12px; white-space: pre-wrap; }
        .pay-box { background: #fffaf0; border: 2px dashed var(--gold); padding: 20px; text-align: center; border-radius: 12px; margin-top: 15px; }
        
        /* Kanjo Widget */
        .kanjo-bubble { position: fixed; bottom: 30px; right: 30px; background: #e53e3e; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 100; }
        .kanjo-window { position: fixed; bottom: 110px; right: 30px; width: 350px; height: 500px; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; z-index: 101; border: 1px solid #ddd; }
        .kanjo-header { background: #e53e3e; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        .kanjo-body { padding: 20px; flex: 1; overflow-y: auto; font-size: 14px; }
        .quiz-opt { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; text-align: left; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--gold); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="nav">
        <div style="font-weight:bold; font-size: 20px;">⚖️ SheriaHub</div>
        <div id="creditsBadge" style="background:var(--gold); padding: 2px 10px; border-radius: 10px; font-size: 12px;">Credits: 0</div>
    </div>

    <div class="hero">
        <h1>Legal Survival Guide</h1>
        <p>Expert legal summaries and Nairobi street smarts.</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setCat('tenant', this)">🏠 Tenancy</div>
        <div class="tab" onclick="setCat('employment', this)">💼 Employment</div>
        <div class="tab" onclick="setCat('traffic', this)">🚗 Traffic</div>
        <div class="tab" onclick="setCat('family', this)">👨‍👩‍👧 Family</div>
    </div>

    <div class="container">
        <textarea id="q" placeholder="What is your legal issue?"></textarea>
        <button class="btn" id="askBtn" onclick="askAi()">Ask AI Consultant</button>
        <div id="res" class="result"></div>
    </div>

    <!-- Kanjo Game -->
    <div class="kanjo-bubble" onclick="toggleKanjo()">👮</div>
    <div id="kanjoWin" class="kanjo-window">
        <div class="kanjo-header"><span>🚨 Kanjo Survival</span> <span onclick="toggleKanjo()" style="cursor:pointer">×</span></div>
        <div class="kanjo-body" id="kanjoBody">
            <p id="kanjoText">Kanjo is approaching! Are you ready to test your street smarts?</p>
            <div id="kanjoCtrl"><button class="btn" style="background:#e53e3e" onclick="gameCycle('START')">Start Game</button></div>
        </div>
    </div>

    <script>
        const API = "https://your-app.onrender.com"; // UPDATE THIS
        let cat = "tenant";

        function setCat(c, el) {
            cat = c;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleKanjo() {
            const w = document.getElementById("kanjoWin");
            w.style.display = (w.style.display === "flex") ? "none" : "flex";
        }

        async function askAi() {
            const q = document.getElementById("q").value;
            const resDiv = document.getElementById("res");
            if(!q) return;

            resDiv.innerHTML = "<div class='loader'></div> Analyzing Kenyan Law...";
            
            const response = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    question: q,
                    category: cat,
                    checkout_id: localStorage.getItem("sheria_id")
                })
            });
            const data = await response.json();
            
            if(data.status === "premium") {
                resDiv.innerHTML = `<div class="premium-box"><b>Detailed Analysis:</b><br>${data.content}</div>`;
                document.getElementById("creditsBadge").innerText = `Credits: ${data.credits_left}`;
            } else {
                resDiv.innerHTML = `
                    <div style="border-left:4px solid var(--navy); padding-left:15px;"><b>Summary:</b><br>${data.summary}</div>
                    <div class="pay-box">
                        <p>🔒 Unlock Detailed Acts & Sections</p>
                        <input type="text" id="phone" placeholder="2547..." style="padding:10px; border-radius:5px; border:1px solid #ddd;"><br>
                        <button class="btn" style="width:auto; padding:10px 30px;" onclick="pay()">Pay KSh 20 (2 Credits)</button>
                    </div>`;
            }
        }

        async function pay() {
            const phone = document.getElementById("phone").value;
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ phone })
            });
            const data = await res.json();
            if(data.checkout_id) {
                alert("Check phone for M-Pesa prompt");
                poll(data.checkout_id);
            }
        }

        function poll(id) {
            const timer = setInterval(async () => {
                const res = await fetch(`${API}/check-payment/${id}`);
                const data = await res.json();
                if(data.status === "paid") {
                    clearInterval(timer);
                    localStorage.setItem("sheria_id", id);
                    document.getElementById("creditsBadge").innerText = `Credits: ${data.credits}`;
                    askAi();
                }
            }, 3000);
        }

        async function gameCycle(input) {
            const text = document.getElementById("kanjoText");
            const ctrl = document.getElementById("kanjoCtrl");
            text.innerHTML = "<div class='loader'></div> Kanjo is thinking...";
            ctrl.innerHTML = "";

            const res = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ question: input, category: "kanjo" })
            });
            const data = await res.json();
            text.innerHTML = data.summary.replace(/\n/g, "<br>");
            ctrl.innerHTML = `
                <button class="quiz-opt" onclick="gameCycle('Option A')">Option A</button>
                <button class="quiz-opt" onclick="gameCycle('Option B')">Option B</button>
                <button class="quiz-opt" onclick="gameCycle('Option C')">Option C</button>
                <button class="btn" style="background:#718096" onclick="gameCycle('START')">Reset Game</button>
            `;
        }
    </script>
</body>
</html>
