<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub - Kenya's Legal AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #2d3748; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2, .navbar div { font-family: 'Poppins', sans-serif; }
        .navbar { background: var(--navy); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); }
        .hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 80px; }
        .category-selector { display: flex; justify-content: center; gap: 10px; margin: -30px auto 20px; padding: 0 15px; flex-wrap: wrap; z-index: 10; position: relative; }
        .cat-btn { padding: 10px 20px; border-radius: 25px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .cat-btn.active { background: var(--gold); color: black; }
        .chat-container { width: 95%; max-width: 600px; margin: 20px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; padding: 15px; border-radius: 10px; border: 2px solid #ddd; font-size: 16px; margin-bottom: 10px; resize: none; box-sizing: border-box; outline: none; }
        .ask-btn { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .ask-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        .legal-card { padding: 20px; border-left: 5px solid var(--navy); background: #f9fafb; margin-top: 20px; border-radius: 8px; }
        .paywall { background: #fffdf2; border: 2px dashed var(--gold); padding: 25px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .premium-content { background: #eefdf3; border: 2px solid #27ae60; padding: 25px; border-radius: 12px; margin-top: 20px; white-space: pre-wrap; }
        .footer { background: var(--navy); color: white; text-align: center; padding: 30px; border-top: 5px solid var(--gold); margin-top: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.4rem;">⚖️ SheriaHub</div>
        <div style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px;">KENYA 🇰🇪</div>
    </nav>

    <div class="hero">
        <h1>Your Legal Rights, Simplified.</h1>
        <p>Instant legal intelligence for Citizens & Motorists.</p>
    </div>

    <div class="category-selector">
        <button class="cat-btn active" id="btn-tenant" onclick="setCat('tenant')">🏠 Tenancy</button>
        <button class="cat-btn" id="btn-employment" onclick="setCat('employment')">💼 Employment</button>
        <button class="cat-btn" id="btn-land" onclick="setCat('land')">🌳 Land</button>
        <button class="cat-btn" id="btn-family" onclick="setCat('family')">👨‍👩‍👧 Family</button>
        <button class="cat-btn" id="btn-traffic" onclick="setCat('traffic')">🚗 Traffic</button>
    </div>

    <main class="chat-container">
        <textarea id="q" placeholder="Ask about rent, deposits, or evictions..."></textarea>
        <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
        <div id="res"></div>
    </main>

    <footer class="footer">
        <p>© 2026 SheriaHub Kenya | Built for Justice</p>
    </footer>

<script>
    const API = "https://sheriahub.onrender.com"; 
    let cat = "tenant";
    let lastQ = "";
    let paymentInterval = null;

    function setCat(c) {
        cat = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${c}`).classList.add('active');
        const placeholders = {
            tenant: "Ask about rent, deposits, or evictions...",
            employment: "Ask about contracts, dismissal, or leave...",
            land: "Ask about title deeds or land buying...",
            family: "Ask about child maintenance, custody, or divorce...",
            traffic: "Ask about traffic fines or accidents..."
        };
        document.getElementById("q").placeholder = placeholders[c];
    }

    async function askAi(checkId = null) {
        const qInput = document.getElementById("q");
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        
        const question = qInput.value || lastQ;
        if (!question) return;
        lastQ = question;

        btn.disabled = true;
        resDiv.innerHTML = `<p style="text-align:center; font-weight:500;">⏳ Sheria AI is generating your deep-dive...</p>`;

        try {
            const response = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question, category: cat, checkout_id: checkId })
            });
            
            const data = await response.json();

            if (!response.ok) {
                resDiv.innerHTML = `<p style="color:red; text-align:center;">⚠️ AI Error: ${data.error || 'Server error'}. Please try again.</p>`;
                return;
            }

            if (data.status === "premium") {
                // Formatting: Convert double newlines to breaks for readability
                const formattedContent = data.content.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
                resDiv.innerHTML = `<div class="premium-content"><h3>📋 Full Deep-Dive Result</h3>${formattedContent}</div>`;
                resDiv.scrollIntoView({ behavior: 'smooth' });
            } else {
                resDiv.innerHTML = `
                    <div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div>
                    <div class="paywall">
                        <h4>🔒 Unlock Detailed Legal Sections</h4>
                        <p>Get the deep-dive analysis for <strong>KSh 20</strong></p>
                        <input type="tel" id="phone" placeholder="07XXXXXXXX" style="padding:10px; width:80%; max-width:280px; margin-bottom:12px; border-radius:8px; border:1px solid #ccc;"><br>
                        <button class="ask-btn" style="background:var(--gold);color:black;max-width:280px;" id="payBtn" onclick="pay()">Pay via M-Pesa</button>
                        <div id="pStat" style="margin-top:12px; font-weight:600;"></div>
                    </div>`;
            }
        } catch (e) {
            resDiv.innerHTML = "<p style='color:red;text-align:center;'>The server is taking too long. Please refresh and try again.</p>";
        } finally {
            btn.disabled = false;
        }
    }

    async function pay() {
        const pInput = document.getElementById("phone").value;
        const pStat = document.getElementById("pStat");
        const payBtn = document.getElementById("payBtn");

        if(!pInput) return alert("Please enter your M-Pesa phone number");
        if (paymentInterval) clearInterval(paymentInterval);

        pStat.innerText = "⏳ Requesting M-Pesa payment...";
        payBtn.disabled = true;

        try {
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ phone: pInput })
            });
            const data = await res.json();
            
            if (!data.checkout_id) {
                pStat.innerText = "❌ M-Pesa failed. Try again.";
                payBtn.disabled = false;
                return;
            }

            pStat.innerText = "📩 Prompt sent! Enter your PIN on your phone...";

            paymentInterval = setInterval(async () => {
                try {
                    const check = await fetch(`${API}/check-payment/${data.checkout_id}`);
                    const r = await check.json();
                    if (r.status === "paid") {
                        clearInterval(paymentInterval);
                        pStat.innerText = "✅ Payment Confirmed!";
                        askAi(data.checkout_id);
                    }
                } catch (e) {}
            }, 4000);

        } catch (e) { 
            pStat.innerText = "❌ Connection failed. Check your internet."; 
            payBtn.disabled = false;
        }
    }
</script>
</body>
</html>
