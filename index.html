<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub | AI Legal Consultant & Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --navy: #0a1f44; 
            --gold: #f39c12; 
            --bg: #f5f7fa; 
            --white: #ffffff; 
            --text: #2d3748; 
            --success: #38a169;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            color: var(--text); 
        }

        h1, h2, h3, .navbar-brand { font-family: 'Poppins', sans-serif; }

        /* Navigation */
        .navbar { 
            background: var(--navy); 
            color: white; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid var(--gold); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }

        /* Hero Section */
        .hero { background: var(--navy); color: white; text-align: center; padding: 40px 20px 80px; }
        .hero h1 { margin: 0; font-size: 2.2rem; }
        .hero p { opacity: 0.9; margin-top: 10px; }

        /* Category Tabs */
        .category-selector { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin: -40px auto 30px; 
            padding: 0 15px; 
            flex-wrap: wrap; 
            z-index: 10; 
            position: relative; 
            max-width: 1000px; 
        }
        .cat-btn { 
            padding: 10px 20px; 
            border-radius: 30px; 
            border: 2px solid var(--gold); 
            background: var(--white); 
            cursor: pointer; 
            font-weight: 600; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            font-size: 0.9rem; 
        }
        .cat-btn.active { background: var(--gold); color: white; transform: translateY(-2px); }

        /* Main Chat Area */
        .chat-container { 
            width: 95%; 
            max-width: 800px; 
            margin: 20px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #e2e8f0; 
            font-size: 16px; 
            margin-bottom: 15px; 
            resize: none; 
            outline: none; 
            font-family: inherit; 
        }
        textarea:focus { border-color: var(--gold); }

        .ask-btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--navy); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.1rem; 
        }
        .ask-btn:hover { background: #1a3a6d; }
        .ask-btn:disabled { background: #cbd5e0; cursor: not-allowed; }

        /* Results & Paywall */
        .result-box { margin-top: 25px; }
        .legal-card { 
            padding: 20px; 
            border-left: 6px solid var(--navy); 
            background: #f8fafc; 
            border-radius: 8px; 
            line-height: 1.6;
        }
        .premium-content { 
            background: #f0fff4; 
            border: 2px solid var(--success); 
            padding: 25px; 
            border-radius: 15px; 
            white-space: pre-wrap;
        }
        .paywall { 
            background: #fffbeb; 
            border: 2px dashed var(--gold); 
            padding: 25px; 
            border-radius: 15px; 
            margin-top: 20px; 
            text-align: center; 
        }
        .phone-input {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 1rem;
            text-align: center;
        }

        /* Quiz Widget */
        .widget-bubble { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: var(--gold); 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 2rem; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            z-index: 2000; 
        }
        .widget-window { 
            position: fixed; 
            bottom: 110px; 
            right: 30px; 
            width: 350px; 
            height: 500px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            display: none; 
            flex-direction: column; 
            z-index: 2001; 
            border: 1px solid #e2e8f0; 
            overflow: hidden; 
        }
        .widget-header { background: var(--navy); color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: 700; }
        .widget-body { flex: 1; padding: 20px; overflow-y: auto; background: #fcfcfc; }
        .quiz-option { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 10px; 
            border: 1px solid #ddd; 
            background: white; 
            cursor: pointer; 
            text-align: left; 
            font-weight: 600; 
        }
        .quiz-option:hover { border-color: var(--gold); background: #fffcf0; }

        .footer { background: var(--navy); color: white; text-align: center; padding: 30px; margin-top: auto; }

        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">⚖️ SheriaHub AI</div>
        <div style="font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px;">KENYA 🇰🇪</div>
    </nav>

    <header class="hero">
        <h1>Legal Advice, Instant & Affordable.</h1>
        <p>Expert legal summaries and detailed analysis in seconds.</p>
    </header>

    <div class="category-selector">
        <button class="cat-btn active" onclick="setCat('tenant', this)">🏠 Tenancy</button>
        <button class="cat-btn" onclick="setCat('employment', this)">💼 Employment</button>
        <button class="cat-btn" onclick="setCat('family', this)">👨‍👩‍👧 Family</button>
        <button class="cat-btn" onclick="setCat('traffic', this)">🚗 Traffic</button>
        <button class="cat-btn" onclick="setCat('civil', this)">⚖️ Civil/Criminal</button>
    </div>

    <main class="chat-container">
        <textarea id="userInput" placeholder="Ask about rent increases, deposits, or evictions..."></textarea>
        <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
        
        <div id="resultArea" class="result-box">
            <!-- Results will appear here -->
        </div>
    </main>

    <!-- Quiz Widget -->
    <div class="widget-bubble" onclick="toggleWidget()">🎮</div>
    <div id="gameWidget" class="widget-window">
        <div class="widget-header">
            <span>Sheria Quiz Master</span>
            <span style="cursor:pointer;" onclick="toggleWidget()">✕</span>
        </div>
        <div class="widget-body" id="gameBody">
            <p id="gameText">Welcome! Test your legal knowledge to win credits. Ready?</p>
            <div id="gameControls">
                <button class="ask-btn" onclick="gameCycle('START')">Start Quiz 🚀</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2024 SheriaHub Kenya | For Educational Purposes Only</p>
    </footer>

    <script>
        // REPLACE WITH YOUR ACTUAL RENDER BACKEND URL
        const API_URL = "https://your-app-name.onrender.com"; 
        
        let currentCategory = "tenant";

        function setCat(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const placeholders = {
                tenant: "Ask about rent, deposits, or evictions...",
                employment: "Ask about dismissal, leave, or contracts...",
                family: "Ask about marriage, divorce, or custody...",
                traffic: "Ask about fines, NTSA, or police conduct...",
                civil: "Ask about lawsuits, theft, or police cases..."
            };
            document.getElementById("userInput").placeholder = placeholders[cat];
        }

        function toggleWidget() {
            const w = document.getElementById("gameWidget");
            w.style.display = (w.style.display === "flex") ? "none" : "flex";
        }

        // --- Main AI Function ---
        async function askAi() {
            const question = document.getElementById("userInput").value;
            const resDiv = document.getElementById("resultArea");
            const btn = document.getElementById("askBtn");

            if (!question) return alert("Please enter a question");

            btn.disabled = true;
            resDiv.innerHTML = `<div class="loader"></div><p style="text-align:center">Consulting Sheria AI...</p>`;

            try {
                const response = await fetch(`${API_URL}/ask-ai`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question: question,
                        category: currentCategory,
                        checkout_id: localStorage.getItem('last_payment_id')
                    })
                });

                const data = await response.json();

                if (data.status === "premium") {
                    resDiv.innerHTML = `
                        <div class="premium-content">
                            <h3>📋 Detailed Analysis</h3>
                            ${data.content.replace(/\n/g, '<br>')}
                        </div>`;
                } else {
                    resDiv.innerHTML = `
                        <div class="legal-card">
                            <strong>Quick Summary:</strong><br>${data.summary}
                        </div>
                        <div class="paywall">
                            <h4>🔒 Unlock Full Analysis</h4>
                            <p>Get specific Acts, Sections, and detailed advice for KSh 20.</p>
                            <input type="text" id="phone" class="phone-input" placeholder="2547XXXXXXXX"><br>
                            <button class="ask-btn" style="width:auto; padding: 10px 30px;" onclick="startPayment()">Pay via M-Pesa</button>
                        </div>`;
                }
            } catch (err) {
                resDiv.innerHTML = "Error connecting to server. Please try again later.";
            } finally {
                btn.disabled = false;
            }
        }

        // --- Payment Logic ---
        async function startPayment() {
            const phone = document.getElementById("phone").value;
            if (!phone) return alert("Enter M-Pesa phone number");

            try {
                const res = await fetch(`${API_URL}/stkpush-game`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: phone })
                });
                const data = await res.json();

                if (data.checkout_id) {
                    alert("STK Push sent! Enter your M-Pesa PIN on your phone.");
                    pollStatus(data.checkout_id);
                }
            } catch (e) { alert("Payment error"); }
        }

        async function pollStatus(id) {
            const resArea = document.getElementById("resultArea");
            const interval = setInterval(async () => {
                resArea.innerHTML = `<div class="loader"></div><p style="text-align:center">Waiting for payment confirmation...</p>`;
                
                const res = await fetch(`${API_URL}/check-payment/${id}`);
                const data = await res.json();

                if (data.status === "paid") {
                    clearInterval(interval);
                    localStorage.setItem('last_payment_id', id);
                    alert("Payment confirmed!");
                    askAi(); // Refresh to show premium content
                }
            }, 3000);
        }

        // --- Game Logic ---
        async function gameCycle(input) {
            const text = document.getElementById("gameText");
            const ctrl = document.getElementById("gameControls");
            
            text.innerHTML = "Thinking...";
            ctrl.innerHTML = "";

            try {
                const res = await fetch(`${API_URL}/ask-ai`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: input, category: "game" })
                });
                const data = await res.json();
                
                text.innerHTML = data.summary.replace(/\n/g, '<br>');
                ctrl.innerHTML = `
                    <button class="quiz-option" onclick="gameCycle('Option A')">Option A</button>
                    <button class="quiz-option" onclick="gameCycle('Option B')">Option B</button>
                    <button class="quiz-option" onclick="gameCycle('Option C')">Option C</button>
                    <button class="ask-btn" style="margin-top:15px; background:#718096;" onclick="gameCycle('START')">Skip / New Question</button>
                `;
            } catch (e) { text.innerHTML = "Error loading quiz."; }
        }
    </script>
</body>
</html>
