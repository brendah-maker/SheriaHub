<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheriaHub - Kenya's Legal AI</title>
    <style>
        :root { --navy: #0a1f44; --gold: #f39c12; --bg: #f5f7fa; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: var(--navy); color: white; padding: 15px; border-bottom: 3px solid var(--gold); text-align: center; }
        .hero { background: var(--navy); color: white; text-align: center; padding: 30px 10px 60px; }
        .category-selector { display: flex; justify-content: center; gap: 10px; margin-top: -25px; }
        .cat-btn { padding: 10px 20px; border-radius: 20px; border: 2px solid var(--gold); background: white; cursor: pointer; font-weight: bold; }
        .cat-btn.active { background: var(--gold); }
        .chat-container { width: 90%; max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; margin-bottom: 10px; resize: none; font-size: 16px; }
        .ask-btn { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .ask-btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .legal-card { padding: 15px; border-left: 5px solid var(--navy); background: #f8fafc; margin-top: 20px; border-radius: 5px; }
        .paywall { background: #fffdf2; border: 2px dashed var(--gold); padding: 20px; border-radius: 10px; margin-top: 15px; text-align: center; }
        .premium-content { background: #eefdf3; border: 2px solid #27ae60; padding: 20px; border-radius: 10px; margin-top: 20px; line-height: 1.6; }
        @media (max-width: 480px) { .cat-btn { font-size: 12px; padding: 8px 12px; } }
    </style>
</head>
<body>

    <nav class="navbar">⚖️ SheriaHub Kenya</nav>
    <header class="hero">
        <h1>Legal Intelligence</h1>
        <p>Simplified for Citizens & Employees</p>
    </header>

    <div class="category-selector">
        <button class="cat-btn active" id="t-btn" onclick="setCat('tenant')">🏠 Tenant/Landlors Laws</button>
        <button class="cat-btn" id="e-btn" onclick="setCat('employment')">💼 Employment Laws</button>
    </div>

    <main class="chat-container">
        <textarea id="q" placeholder="Ask your legal question..."></textarea>
        <button class="ask-btn" id="askBtn" onclick="askAi()">Get AI Consultation</button>
        <div id="res"></div>
    </main>

<script>
    const API = "https://sheriahub.onrender.com"; // Update to your Render URL
    let cat = "tenant";
    let lastQ = "";

    function setCat(c) {
        cat = c;
        document.getElementById('t-btn').classList.toggle('active', c === 'tenant');
        document.getElementById('e-btn').classList.toggle('active', c === 'employment');
    }

    async function askAi(checkId = null) {
        const qInput = document.getElementById("q");
        const resDiv = document.getElementById("res");
        const btn = document.getElementById("askBtn");
        
        const question = qInput.value || lastQ;
        if (!question) return;
        lastQ = question;

        // Start Loading State
        btn.disabled = true;
        resDiv.innerHTML = "<p id='msg' style='text-align:center;'>⏳ Sheria AI is pulling Kenyan law records...</p>";

        // Timeout handler
        const timer = setTimeout(() => {
            const msg = document.getElementById('msg');
            if(msg) {
                msg.innerText = "Request timed out. Please try again.";
                msg.style.color = "red";
                btn.disabled = false;
            }
        }, 30000);

        try {
            const response = await fetch(`${API}/ask-ai`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ question, category: cat, checkout_id: checkId })
            });
            
            clearTimeout(timer);
            const data = await response.json();

            if (data.status === "premium") {
                resDiv.innerHTML = `<div class="premium-content"><h3>📋 Full Deep-Dive</h3>${data.content.replace(/\n/g, '<br>')}</div>`;
            } else {
                resDiv.innerHTML = `
                    <div class="legal-card"><strong>Summary:</strong><br>${data.summary}</div>
                    <div class="paywall">
                        <h4>🔒 Unlock Full Citations</h4>
                        <p>Get Acts & Steps for <strong>KSh 20</strong></p>
                        <input type="tel" id="phone" placeholder="07..." style="padding:10px; width:80%; margin-bottom:10px;"><br>
                        <button class="ask-btn" style="background:var(--gold);color:black;" onclick="pay()">Pay via M-Pesa</button>
                        <div id="pStat" style="margin-top:10px;"></div>
                    </div>`;
            }
        } catch (e) {
            clearTimeout(timer);
            resDiv.innerHTML = "<p style='color:red;text-align:center;'>Request timed out. Please try again.</p>";
        } finally {
            btn.disabled = false;
        }
    }

    async function pay() {
        const pInput = document.getElementById("phone").value;
        const pStat = document.getElementById("pStat");
        if(!pInput) return alert("Enter phone");

        pStat.innerText = "⏳ Sending STK Push...";
        try {
            const res = await fetch(`${API}/stkpush`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ phone: pInput })
            });
            const { checkout_id } = await res.json();

            const poller = setInterval(async () => {
                const check = await fetch(`${API}/check-payment/${checkout_id}`);
                const r = await check.json();
                if (r.status === "paid") {
                    clearInterval(poller);
                    pStat.innerText = "✅ Paid! Unlocking...";
                    askAi(checkout_id);
                }
            }, 4000);
        } catch (e) { pStat.innerText = "❌ Payment failed."; }
    }
</script>
</body>
</html>
